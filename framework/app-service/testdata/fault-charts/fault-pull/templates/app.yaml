apiVersion: apps/v1
kind: Deployment
metadata:
  name: faultpull
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.workloads.faultpull.replicaCount }}
  selector:
    matchLabels:
      app: fault-pull
  template:
    metadata:
      labels:
        app: fault-pull
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      containers:
        - name: fault-pull
          image: docker.io/library/definitely-missing-fault-image:0
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: fault-pull-svc
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: fault-pull
  ports:
    - name: http
      port: 80
      targetPort: 80
