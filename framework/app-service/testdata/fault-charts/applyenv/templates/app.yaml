apiVersion: batch/v1
kind: Job
metadata:
  name: applyenv-hold
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        gateway.olares.io/shared-caller-outbound: "false"
      annotations:
        linkerd.io/inject: disabled
    spec:
      restartPolicy: Never
      containers:
        - name: hold
          image: docker.io/library/busybox:1.36
          command: ["sleep", "30"]
---
{{- $break := "" }}
{{- if .Values.olaresEnv }}
{{- $break = index .Values.olaresEnv "BREAK" | default "" | toString }}
{{- end }}
{{- if eq $break "1" }}
{{- fail "apply-env-boom" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: applyenv
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.workloads.applyenv.replicaCount }}
  selector:
    matchLabels:
      app: applyenv
  template:
    metadata:
      labels:
        app: applyenv
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      containers:
        - name: applyenv
          image: docker.io/beclab/harveyff-adguardhome:v0.107.77
          args: ["--web-addr", "0.0.0.0:80", "--no-check-update"]
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: applyenv-svc
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: applyenv
  ports:
    - name: http
      port: 80
      targetPort: 80
