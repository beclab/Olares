apiVersion: apps/v1
kind: Deployment
metadata:
  name: holdinst
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.workloads.holdinst.replicaCount }}
  selector:
    matchLabels:
      app: holdinst
  template:
    metadata:
      labels:
        app: holdinst
    spec:
      nodeSelector:
        kubernetes.io/hostname: nosuchnode
      containers:
        - name: holdinst
          image: docker.io/beclab/harveyff-adguardhome:v0.107.77
          args: ["--web-addr", "0.0.0.0:80", "--no-check-update"]
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: holdinst-svc
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: holdinst
  ports:
    - name: http
      port: 80
      targetPort: 80
