# Login is served by olares-app-deployment in os-frontend. Keep this chart
# and release: Helm upgrades remove the old authelia-deployment while retaining
# the existing backend aliases and provider permissions.
---
apiVersion: v1
kind: Service
metadata:
  name: authelia-svc
  namespace: user-space-{{ .Values.bfl.username }}
spec:
  # Preserve legacy in-cluster callers without a per-user Login deployment.
  type: ExternalName
  externalName: authelia-svc.os-frontend.svc.cluster.local
  ports:
    - protocol: TCP
      name: authelia
      port: 80
      targetPort: 80
    

---
apiVersion: v1
kind: Service
metadata:
  name: authelia-backend-svc
  namespace: user-space-{{ .Values.bfl.username }}
spec:
  type: ExternalName
  externalName: authelia-backend.user-system-{{ .Values.bfl.username }}.svc.cluster.local
  ports:
    - protocol: TCP
      name: authelia-bakcend
      port: 9091
      targetPort: 9091

---
apiVersion: v1
kind: Service
metadata:
  name: authelia-backend
  namespace: user-system-{{ .Values.bfl.username }}
spec:
  type: ClusterIP
  selector:
    app: systemserver
  ports:
    - protocol: TCP
      name: authelia-bakcend
      port: 9091
      targetPort: 9091      
