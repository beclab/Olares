server {
    listen 92;
    gzip off;
    gzip_disable "msie6";
    gzip_min_length 1k;
    gzip_buffers 16 64k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types *;
    client_max_body_size 2000M;
    keepalive_timeout 2700s;
    root /www/share;
    location = / {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 200 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Olares Share</title></head><body><main><h1>Open a share link</h1><p>Use the complete link sent by the owner.</p><p lang="zh-CN">请使用分享者发给你的完整链接。</p></main></body></html>';
    }

    # Serve the SPA only when a share ID is present. Files validates the ID.
    location = /index.html { return 404; }
    location = /sharable-link { return 404; }
    location = /sharable-link/ { return 404; }

    location ~ ^/sharable-link/[^/]+/?$ {
        try_files /index.html =404;
        add_header Cache-Control "private, no-store";
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "private, no-cache";
    }

    location /api {
        proxy_pass http://files:28080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Host $host;
        add_header Accept-Ranges bytes;
        client_body_timeout 600s;
        client_max_body_size 4000M;
        proxy_request_buffering off;
        keepalive_timeout 750s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /upload {
        proxy_pass http://files:28080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Host $host;
        add_header Accept-Ranges bytes;
        client_body_timeout 600s;
        client_max_body_size 4000M;
        proxy_request_buffering off;
        keepalive_timeout 750s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /videos {
        proxy_pass http://files:28080/videos;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Host $host;
        add_header Accept-Ranges bytes;
        client_body_timeout 600s;
        client_max_body_size 4000M;
        proxy_request_buffering off;
        keepalive_timeout 750s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /bfl/info/v1/olares-info {
        add_header Access-Control-Allow-Headers "access-control-allow-headers,access-control-allow-methods,access-control-allow-origin,content-type,x-auth,x-unauth-error,x-authorization";
        proxy_pass http://bfl;
        proxy_set_header            Host $host;
        proxy_set_header            X-real-ip $remote_addr;
        proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Frame-Options SAMEORIGIN;
    }

    location ~ ^/(assets|js|css|fonts|img)/.*\.(js|css|png|jpg|svg|woff|woff2)$
    {
        add_header Cache-Control "public, max-age=2678400";
    }

}
