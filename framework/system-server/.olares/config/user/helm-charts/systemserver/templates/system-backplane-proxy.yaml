---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-backplane-proxy
  namespace: user-system-{{ .Values.bfl.username }}
  labels:
    app: system-backplane-proxy
    envoy.olares.io/role: platform-backplane
    applications.app.bytetrade.io/author: bytetrade.io
  annotations:
    applications.app.bytetrade.io/version: '0.0.1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: system-backplane-proxy
  template:
    metadata:
      labels:
        app: system-backplane-proxy
        envoy.olares.io/role: platform-backplane
        envoy.olares.io/allowlist: "true"
    spec:
      priorityClassName: "system-cluster-critical"
      containers:
      - name: proxy
        image: beclab/envoy:v1.25.11.1
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 1000
        ports:
        - name: redis-proxy
          containerPort: 6379
        - name: mongo-proxy
          containerPort: 27017
        - name: pg-proxy
          containerPort: 5432
        - name: nats-proxy
          containerPort: 4222
        - name: auth-proxy
          containerPort: 9091
        - name: knowledge-proxy
          containerPort: 3010
        - name: fakes3-proxy
          containerPort: 4568
        - name: infisical-proxy
          containerPort: 8080
        - name: vault-proxy
          containerPort: 3000
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        - name: proxy-config
          readOnly: true
          mountPath: /etc/envoy/envoy.yaml
          subPath: envoy.yaml
        command:
        - /usr/local/bin/envoy
        - --log-level
        - debug
        - -c
        - /etc/envoy/envoy.yaml
        env:
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      volumes:
      - name: proxy-config
        configMap:
          name: systemserver-proxy-configs
          items:
          - key: envoy.yaml
            path: envoy.yaml

---
apiVersion: v1
kind: Service
metadata:
  name: system-backplane-proxy
  namespace: user-system-{{ .Values.bfl.username }}
  labels:
    app: system-backplane-proxy
spec:
  type: ClusterIP
  selector:
    app: system-backplane-proxy
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
      name: redis-proxy
    - protocol: TCP
      port: 27017
      targetPort: 27017
      name: mongo-proxy
    - protocol: TCP
      port: 5432
      targetPort: 5432
      name: pg-proxy
    - protocol: TCP
      port: 4222
      targetPort: 4222
      name: nats-proxy
    - protocol: TCP
      port: 9091
      targetPort: 9091
      name: auth-proxy
    - protocol: TCP
      port: 3010
      targetPort: 3010
      name: knowledge-proxy
    - protocol: TCP
      port: 4568
      targetPort: 4568
      name: fakes3-proxy
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: infisical-proxy
    - protocol: TCP
      port: 3000
      targetPort: 3000
      name: vault-proxy

---
apiVersion: v1
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: listener_redis_proxy
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 6379
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: destination
                    cluster: cluster_redis_proxy
        - name: listener_mongo_proxy
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 27017
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: destination
                    cluster: cluster_mongo_proxy
        - name: listener_pg_proxy
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 5432
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: destination
                    cluster: cluster_pg_proxy
        - name: listener_nats_proxy
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 4222
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: destination
                    cluster: cluster_nats_proxy
        - name: listener_auth_backend_proxy
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 9091
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: destination
                    cluster: cluster_auth_backend_proxy
        - name: listener_knowledge_api_proxy
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 3010
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: destination
                    cluster: cluster_knowledge_api_proxy
        - name: listener_fakes3_proxy
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 4568
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: destination
                    cluster: cluster_fakes3_proxy
        - name: listener_infisical_proxy
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8080
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: destination
                    cluster: cluster_infisical_proxy
        - name: listener_vault_proxy
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 3000
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: destination
                    cluster: cluster_vault_proxy
      clusters:
        - name: cluster_redis_proxy
          connect_timeout: 30s
          type: LOGICAL_DNS
          dns_lookup_family: V4_ONLY
          load_assignment:
            cluster_name: cluster_redis_proxy
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: redis-cluster-proxy.os-platform.svc.cluster.local
                          port_value: 6379
        - name: cluster_mongo_proxy
          connect_timeout: 30s
          type: LOGICAL_DNS
          dns_lookup_family: V4_ONLY
          load_assignment:
            cluster_name: cluster_mongo_proxy
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: mongo-cluster-mongos.os-platform.svc.cluster.local
                          port_value: 27017
        - name: cluster_pg_proxy
          connect_timeout: 30s
          type: LOGICAL_DNS
          dns_lookup_family: V4_ONLY
          load_assignment:
            cluster_name: cluster_pg_proxy
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: citus-0.citus-headless.os-platform.svc.cluster.local
                          port_value: 5432
        - name: cluster_nats_proxy
          connect_timeout: 30s
          type: LOGICAL_DNS
          dns_lookup_family: V4_ONLY
          load_assignment:
            cluster_name: cluster_nats_proxy
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: nats.os-platform.svc.cluster.local
                          port_value: 4222
        - name: cluster_auth_backend_proxy
          connect_timeout: 30s
          type: LOGICAL_DNS
          dns_lookup_family: V4_ONLY
          load_assignment:
            cluster_name: cluster_auth_backend_proxy
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: authelia-backend.os-framework.svc.cluster.local
                          port_value: 9091
        - name: cluster_knowledge_api_proxy
          connect_timeout: 30s
          type: LOGICAL_DNS
          dns_lookup_family: V4_ONLY
          load_assignment:
            cluster_name: cluster_knowledge_api_proxy
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: rss-svc.os-framework.svc.cluster.local
                          port_value: 3010
        - name: cluster_fakes3_proxy
          connect_timeout: 30s
          type: LOGICAL_DNS
          dns_lookup_family: V4_ONLY
          load_assignment:
            cluster_name: cluster_fakes3_proxy
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: tapr-s3-svc.os-platform.svc.cluster.local
                          port_value: 4568
        - name: cluster_infisical_proxy
          connect_timeout: 30s
          type: LOGICAL_DNS
          dns_lookup_family: V4_ONLY
          load_assignment:
            cluster_name: cluster_infisical_proxy
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: infisical-service.os-protected.svc.cluster.local
                          port_value: 8080
        - name: cluster_vault_proxy
          connect_timeout: 30s
          type: LOGICAL_DNS
          dns_lookup_family: V4_ONLY
          load_assignment:
            cluster_name: cluster_vault_proxy
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: vault-server.os-framework.svc.cluster.local
                          port_value: 3000
kind: ConfigMap
metadata:
  name: systemserver-proxy-configs
  namespace: user-system-{{ .Values.bfl.username }}
