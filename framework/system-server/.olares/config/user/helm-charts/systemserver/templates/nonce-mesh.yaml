{{- $ns := printf "user-system-%s" .Values.bfl.username -}}
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: systemserver-api
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app: systemserver
  port: 80
  proxyProtocol: HTTP/1
  accessPolicy: deny
---
# No catch-all route may overlap nonce. Noncanonical requests fail closed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: systemserver-nonce
  namespace: {{ $ns }}
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
      name: systemserver-api
  rules:
    - matches:
        - path:
            type: Exact
            value: /permission/v1alpha1/nonce
          method: GET
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: systemserver-nonce
  namespace: {{ $ns }}
spec:
  identityRefs:
    - kind: ServiceAccount
      name: authelia-backend
      namespace: os-framework
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: systemserver-nonce
  namespace: {{ $ns }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: systemserver-nonce
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: systemserver-nonce
---
# Preserve the registered API modules without granting the nonce prefix.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: systemserver-api-existing
  namespace: {{ $ns }}
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
      name: systemserver-api
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /permission/v2alpha1
        - path:
            type: PathPrefix
            value: /provider/v2alpha1
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: systemserver-api-existing
  namespace: {{ $ns }}
spec:
  identities: ["*.serviceaccount.identity.linkerd.cluster.local"]
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: systemserver-api-existing
  namespace: {{ $ns }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: systemserver-api-existing
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: systemserver-api-existing
{{- range $port := list 6379 27017 5432 4222 3010 4568 8080 }}
---
# Other listeners retain the previous cluster-authenticated transport boundary.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: systemserver-existing-{{ $port }}
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app: systemserver
  port: {{ $port }}
  {{- if eq $port 4222 }}
  proxyProtocol: opaque
  {{- end }}
  accessPolicy: cluster-authenticated
{{- end }}
