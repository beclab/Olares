---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backend:{{ .Values.bfl.username }}:search-provider-svc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.bfl.username }}:search-provider-svc
subjects:
- kind: ServiceAccount
  name: system-frontend
  namespace: {{ .Release.Namespace }}

---
# The invisible `search3.<terminus>` entrance is authenticated by the Olares
# gateway as the final user. Bind that user to the path-limited domain
# provider; Search3 still performs its own
# user/Owner/query-capability checks for every RAG operation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: user:{{ .Values.bfl.username }}:search-frontend-domain
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.bfl.username }}:search-frontend-domain
subjects:
- kind: User
  name: '{{ .Values.bfl.username }}'
