---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.bfl.username }}:search-provider-svc
  annotations:
    provider-registry-ref: user-system-{{ .Values.bfl.username }}/search3
    provider-service-ref: search3.os-framework:80
rules:
- nonResourceURLs: 
  - "/document/search*"
  - "/task/*"
  - "/search/*"
  # The authenticated per-user Search3 entrance serves TermiPass RAG
  # retrieval directly. Search3 resolves the user's searchable scope from
  # Files; the browser cannot supply trusted owner/root state.
  - "/v1/retrieval/*"
  # TermiPass Settings reaches the Search3 RAG control plane through this
  # provider. Search3 still enforces user/Owner semantics itself.
  - "/rag/*"
  - "/monitorsetting/*"
  - "/file/*"
  verbs: ["*"]
