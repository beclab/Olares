name: Build access-admission candidate image

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA for this run
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  access-admission:
    runs-on: ubuntu-24.04
    steps:
      - name: Check candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"

      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Enable arm64 builds
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Publish candidate
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}/access-admission"
          metadata="$RUNNER_TEMP/image-access-admission.json"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --file framework/app-gateway/cmd/access-admission/Dockerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$image:$GITHUB_SHA" --provenance=mode=max --sbom=true \
            --metadata-file "$metadata" --push framework/app-gateway
          digest=$(jq -er '."containerimage.digest" | select(startswith("sha256:"))' "$metadata")
          docker buildx imagetools inspect "$image@$digest"
          printf '%s@%s\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
