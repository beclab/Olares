# Strip client-supplied identity headers before jwt_authn on the Shared
# east-west path through app-gateway. SecurityPolicy claimToHeaders then
# writes the verified viewer to X-CALLER-USER and the caller appid to
# X-Caller-Appid. X-BFL-USER is removed and not written back, so an
# in-cluster app cannot present it to the upstream.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: app-gateway-strip-identity-headers
  namespace: os-gateway
  labels:
    applications.app.bytetrade.io/author: bytetrade.io
    app.kubernetes.io/name: app-gateway
    app.kubernetes.io/component: client-traffic-policy
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: app-gateway
  headers:
    earlyRequestHeaders:
      remove:
        - x-bfl-user
        - x-caller-user
        - x-caller-appid
