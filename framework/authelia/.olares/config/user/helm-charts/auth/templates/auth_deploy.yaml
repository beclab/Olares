---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia-deployment
  namespace: user-space-{{ .Values.bfl.username }}
  labels:
    app: authelia
    applications.app.bytetrade.io/author: bytetrade.io
  annotations:
    applications.app.bytetrade.io/version: '0.0.1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
        traffic.olares.io/platform-mesh: "true"
      annotations:
        linkerd.io/inject: enabled
        config.linkerd.io/default-inbound-policy: cluster-authenticated
        traffic.olares.io/mtls-mode: Required
    spec:
      priorityClassName: "system-cluster-critical"
      initContainers:
      - args:
        - -it
        - authelia-backend.user-system-{{ .Values.bfl.username }}:9091
        image: owncloudci/wait-for:latest
        imagePullPolicy: IfNotPresent
        name: check-auth
      containers:
      - name: auth-front
        image: beclab/login:v1.13.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        
---
apiVersion: v1
kind: Service
metadata:
  name: authelia-svc
  namespace: user-space-{{ .Values.bfl.username }}
spec:
  selector:
    app: authelia
  type: ClusterIP
  ports:
    - protocol: TCP
      name: authelia
      port: 80
      targetPort: 80
    

---
apiVersion: v1
kind: Service
metadata:
  name: authelia-backend-svc
  namespace: user-space-{{ .Values.bfl.username }}
spec:
  type: ExternalName
  externalName: authelia-backend.user-system-{{ .Values.bfl.username }}.svc.cluster.local
  ports:
    - protocol: TCP
      name: authelia-bakcend
      port: 9091
      targetPort: 9091

---
apiVersion: v1
kind: Service
metadata:
  name: authelia-backend
  namespace: user-system-{{ .Values.bfl.username }}
spec:
  type: ClusterIP
  selector:
    app: systemserver
  ports:
    - protocol: TCP
      name: authelia-bakcend
      port: 9091
      targetPort: 9091
      appProtocol: http

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authelia-app-gateway
  namespace: user-system-{{ .Values.bfl.username }}
  labels:
    app.kubernetes.io/component: linkerd-mesh
    app.kubernetes.io/managed-by: app-service
spec:
  podSelector:
    matchLabels:
      app: systemserver
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: os-gateway
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: app-gateway
              gateway.envoyproxy.io/owning-gateway-namespace: os-gateway
              app.kubernetes.io/component: proxy
              app.kubernetes.io/managed-by: envoy-gateway
      ports:
        - protocol: TCP
          port: 9091
