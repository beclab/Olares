# Access ValidatingAdmissionWebhook (product steady state: HTTP mTLS, no kill switch).
# failurePolicy starts Ignore so install can progress; process promotes to Fail after TLS is ready.
---
apiVersion: v1
kind: Service
metadata:
  name: access-admission
  namespace: os-app-access
  labels:
    app.kubernetes.io/name: access-admission
spec:
  selector:
    app.kubernetes.io/name: access-admission
  ports:
    - name: webhook
      port: 443
      targetPort: 9443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-admission
  namespace: os-app-access
  labels:
    app.kubernetes.io/name: access-admission
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: access-admission
  template:
    metadata:
      labels:
        app.kubernetes.io/name: access-admission
      annotations:
        # The Kubernetes API server reaches this dedicated TLS port outside mesh identity.
        config.linkerd.io/skip-inbound-ports: "9443"
    spec:
      serviceAccountName: access-admission
      containers:
        - name: admission
          image: beclab/access-admission:v0.1.0
          imagePullPolicy: IfNotPresent
          args: []
          env:
            - name: ACCESS_ADMISSION_ADDR
              value: ":9443"
          ports:
            - containerPort: 9443
              name: webhook
          readinessProbe:
            httpGet:
              path: /healthz
              port: webhook
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: webhook
              scheme: HTTPS
            periodSeconds: 20
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-admission
  namespace: os-app-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: access-admission-tls
  namespace: os-app-access
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["access-admission-tls"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # create needs no resourceNames on first bootstrap
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: access-admission-tls
  namespace: os-app-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: access-admission-tls
subjects:
  - kind: ServiceAccount
    name: access-admission
    namespace: os-app-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: access-admission
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    resourceNames: ["access-olares-validate"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["access.olares.io"]
    resources: ["appaccesspolicies", "appcapabilitysets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy.linkerd.io"]
    resources: ["servers", "authorizationpolicies", "meshtlsauthentications"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: access-admission
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: access-admission
subjects:
  - kind: ServiceAccount
    name: access-admission
    namespace: os-app-access
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: access-olares-validate
  labels:
    app.kubernetes.io/name: access-admission
webhooks:
  - name: access.olares.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: access-admission
        namespace: os-app-access
        path: /validate
        port: 443
    failurePolicy: Ignore
    matchPolicy: Equivalent
    sideEffects: None
    timeoutSeconds: 5
    rules:
      - apiGroups: ["access.olares.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["appcapabilitysets", "appaccesspolicies"]
        scope: Namespaced
  - name: posture-config.access.olares.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: access-admission
        namespace: os-app-access
        path: /validate
        port: 443
    failurePolicy: Ignore
    matchPolicy: Equivalent
    sideEffects: None
    timeoutSeconds: 5
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.k8s.io/metadata.name
          operator: In
          values: ["os-app-access", "os-gateway"]
    objectSelector:
      matchExpressions:
        - key: olares.io/uniauth-posture
          operator: In
          values: ["true"]
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["configmaps"]
        scope: Namespaced
