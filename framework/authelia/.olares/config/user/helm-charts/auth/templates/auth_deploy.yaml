---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia-deployment
  namespace: user-space-{{ .Values.bfl.username }}
  labels:
    app: authelia
    applications.app.bytetrade.io/author: bytetrade.io
  annotations:
    applications.app.bytetrade.io/version: '0.0.1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
        traffic.olares.io/platform-mesh: "true"
      annotations:
        linkerd.io/inject: enabled
        config.linkerd.io/proxy-enable-native-sidecar: "true"
        config.linkerd.io/default-inbound-policy: cluster-authenticated
        traffic.olares.io/mtls-mode: Required
    spec:
      priorityClassName: "system-cluster-critical"
      initContainers:
      - name: check-auth
        image: busybox:1.28
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -ec
          - |
            url="http://authelia-backend.user-system-{{ .Values.bfl.username }}:9091/api/health"
            attempts=0
            until wget -q -T 5 -O /dev/null --header "X-BFL-USER: {{ .Values.bfl.username }}" "$url"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 24 ]; then
                echo "Authelia health endpoint is unavailable" >&2
                exit 1
              fi
              sleep 5
            done
      containers:
      - name: auth-front
        image: beclab/login:v1.13.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        
---
apiVersion: v1
kind: Service
metadata:
  name: authelia-svc
  namespace: user-space-{{ .Values.bfl.username }}
spec:
  selector:
    app: authelia
  type: ClusterIP
  ports:
    - protocol: TCP
      name: authelia
      port: 80
      targetPort: 80
      appProtocol: http
    

---
apiVersion: v1
kind: Service
metadata:
  name: authelia-backend-svc
  namespace: user-space-{{ .Values.bfl.username }}
spec:
  type: ExternalName
  externalName: authelia-backend.user-system-{{ .Values.bfl.username }}.svc.cluster.local
  ports:
    - protocol: TCP
      name: authelia-bakcend
      port: 9091
      targetPort: 9091

---
apiVersion: v1
kind: Service
metadata:
  name: authelia-backend
  namespace: user-system-{{ .Values.bfl.username }}
spec:
  type: ClusterIP
  selector:
    app: systemserver
  ports:
    - protocol: TCP
      name: authelia-bakcend
      port: 9091
      targetPort: 9091
      appProtocol: http

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authelia-app-gateway
  namespace: user-system-{{ .Values.bfl.username }}
  labels:
    app.kubernetes.io/component: linkerd-mesh
    app.kubernetes.io/managed-by: app-service
spec:
  podSelector:
    matchLabels:
      app: systemserver
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: os-gateway
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: app-gateway
              gateway.envoyproxy.io/owning-gateway-namespace: os-gateway
              app.kubernetes.io/component: proxy
              app.kubernetes.io/managed-by: envoy-gateway
      ports:
        - protocol: TCP
          port: 9091
