# L4 → app-gateway Entry mTLS channel (product steady state: always on).
# Entry CA is separate from Linkerd identity CA. Client certs from olares-l4-agw-client.
---
apiVersion: v1
kind: Service
metadata:
  name: app-gateway-l4-mtls
  namespace: os-gateway
  labels:
    app.kubernetes.io/name: app-gateway-l4-mtls
    app.kubernetes.io/part-of: app-gateway
    olares.io/uniauth-posture: "true"
spec:
  type: ClusterIP
  selector:
    gateway.envoyproxy.io/owning-gateway-name: app-gateway
    gateway.envoyproxy.io/owning-gateway-namespace: os-gateway
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: envoy-gateway
    app.kubernetes.io/name: envoy
  ports:
    - name: mtls
      port: 8443
      # Envoy Gateway keeps unprivileged listener ports unchanged.
      targetPort: 8443
      protocol: TCP
---
# Linkerd passes only this listener through to Envoy's independent Entry TLS
# authentication. The other listeners inherit the authenticated mesh default.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: app-gateway-entry-mtls
  namespace: os-gateway
spec:
  podSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: app-gateway
      gateway.envoyproxy.io/owning-gateway-namespace: os-gateway
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: envoy-gateway
      app.kubernetes.io/name: envoy
  port: 8443
  proxyProtocol: TLS
  accessPolicy: all-unauthenticated
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: l4-app-gateway-mtls
  namespace: os-gateway
  labels:
    app.kubernetes.io/name: app-gateway-l4-mtls
    olares.io/uniauth-posture: "true"
  annotations:
    olares.io/config-integrity: "release-controlled"
data:
  enabled: "true"
  sni: "app-gateway-l4-mtls.os-gateway.svc.cluster.local"
  httpMeshPolicy: "entry-mtls"
  rotationMode: "same-ca-leaf-rotation"
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: app-gateway-l4-entry-mtls
  namespace: os-gateway
  labels:
    app.kubernetes.io/name: app-gateway
    app.kubernetes.io/component: entry-mtls
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: app-gateway
    sectionName: l4-mtls
  tls:
    clientValidation:
      mode: RequireAndVerify
      subjectAltNames:
        dnsNames:
          - type: Exact
            value: l4-bfl-proxy.entry.client
      caCertificateRefs:
        - kind: Secret
          group: ""
          name: olares-l4-agw-mtls
---
# Bind the L4 ServiceAccount with a RoleBinding in os-gateway to read only the client credential.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: olares-entry-mtls-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["olares-l4-agw-client"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: olares-entry-mtls-reader
  namespace: os-gateway
subjects:
  - kind: ServiceAccount
    name: os-network-internal
    namespace: os-network
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: olares-entry-mtls-reader
