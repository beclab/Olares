{{- if or .Values.bfl.prepareAPIMesh .Values.bfl.enforceAPIMesh -}}
{{- $tenant := .Values.bfl.username -}}
{{- if or (gt (len $tenant) 51) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $tenant)) (ne .Release.Namespace (printf "user-space-%s" $tenant)) -}}
{{- fail "app-service policy requires the launcher tenant's namespace" -}}
{{- end -}}
{{- $name := printf "launcher-api-%s" $tenant -}}
{{- $app := "[a-z0-9]([a-z0-9-]*[a-z0-9])?" -}}
{{- $paths := list "/apps" "/users" "/compute-resources" "/systemenvs" "/userenvs" "/control-hub/apps" "/perms" (printf "/users/%s/metrics" $tenant) -}}
{{- if ne $tenant "admins" -}}
{{- $paths = append $paths (printf "/users/%s" $tenant) -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: os-framework
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
      name: app-service-api
  rules:
    - matches:
      {{- range $path := $paths }}
        - method: GET
          path:
            type: Exact
            value: {{ printf "/app-service/v1%s" $path | quote }}
          headers:
            - name: X-Bfl-User
              type: Exact
              value: {{ $tenant | quote }}
      {{- end }}
      {{- range $path := list
        (printf "/apps/%s/(env|subject|compute-resources/bindings)" $app)
        (printf "/apps/provider-registry/%s" $app)
        (printf "/perms/%s" $app)
        (printf "/applications/%s/(entrances|setup|attachments|attachment-capabilities|device-inventory)" $app)
        (printf "/applications/%s/%s/setup" $app $app) }}
        - method: GET
          path:
            type: RegularExpression
            value: {{ printf "^/app-service/v1%s$" $path | quote }}
          headers:
            - name: X-Bfl-User
              type: Exact
              value: {{ $tenant | quote }}
      {{- end }}
        - method: POST
          path:
            type: Exact
            value: /app-service/v1/appenv/remote-options-proxy
          headers:
            - name: X-Bfl-User
              type: Exact
              value: {{ $tenant | quote }}
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: {{ $name }}
  namespace: os-framework
spec:
  identityRefs:
    - kind: ServiceAccount
      name: bytetrade-sys-ops
      namespace: {{ printf "user-system-%s" $tenant }}
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: {{ $name }}
  namespace: os-framework
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ $name }}
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: {{ $name }}
{{- end }}
