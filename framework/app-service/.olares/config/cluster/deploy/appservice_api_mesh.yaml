{{- $mesh := default dict .Values.appServiceAPIMesh -}}
{{- $marketMesh := default dict .Values.marketBackendMTLS -}}
{{- if $mesh.prepare -}}
{{- if ne .Release.Namespace "os-framework" -}}
{{- fail "app-service API mesh policies belong in os-framework" -}}
{{- end -}}
{{- if or (not $mesh.tenants) (ne (len (default (list) $mesh.tenants)) (len (uniq (default (list) $mesh.tenants)))) -}}
{{- fail "app-service API mTLS requires an explicit tenant inventory" -}}
{{- end -}}
{{- $userProvisioners := default (list) $mesh.userProvisioners -}}
{{- if ne (len $userProvisioners) (len (uniq $userProvisioners)) -}}
{{- fail "app-service API mTLS requires unique user provisioners" -}}
{{- end -}}
{{- range $provisioner := $userProvisioners -}}
{{- if not (has $provisioner $mesh.tenants) -}}
{{- fail "app-service user provisioners must be enrolled tenants" -}}
{{- end -}}
{{- end -}}
{{- /* Enable only after the strict Market replicas are serving. The old replicas share market-sa. */ -}}
{{- if and $mesh.marketLifecycle (or (not $marketMesh.activate) (not $marketMesh.prepare) (not .Values.marketLinkerd) (not (deepEqual (sortAlpha $mesh.tenants) (sortAlpha $marketMesh.tenants)))) -}}
{{- fail "Market lifecycle routes require prepared Market mTLS and proxy injection for the same tenants" -}}
{{- end -}}
{{- $routes := list (dict "name" "market-image-info" "namespace" "os-framework" "account" "market-sa" "method" "POST" "path" "/app-service/v1/apps/image-info") -}}
{{- range $name, $path := dict "market-status-user" "/user-info" "market-status-user-resource" "/user/resource" "market-status-cluster-resource" "/cluster/resource" "market-status-version" "/terminus/version" -}}
{{- $routes = append $routes (dict "name" $name "namespace" "os-framework" "account" "market-sa" "method" "GET" "path" (printf "/app-service/v1%s" $path)) -}}
{{- end -}}
{{- range $tenant := $mesh.tenants -}}
{{- if or (gt (len $tenant) 51) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $tenant)) -}}
{{- fail "invalid app-service API mTLS tenant" -}}
{{- end -}}
{{- if $mesh.marketLifecycle -}}
{{- $marketAppPath := "^/app-service/v1/apps/[a-z0-9]([a-z0-9-]*[a-z0-9])?" -}}
{{- $routes = append $routes (dict "name" (printf "market-install-%s" $tenant) "namespace" "os-framework" "account" "market-sa" "method" "POST" "path" (printf "%s/install$" $marketAppPath) "pathType" "RegularExpression" "userHeader" $tenant) -}}
{{- $routes = append $routes (dict "name" (printf "market-app-progress-%s" $tenant) "namespace" "os-framework" "account" "market-sa" "method" "GET" "path" (printf "%s/status$" $marketAppPath) "pathType" "RegularExpression" "userHeader" $tenant) -}}
{{- $routes = append $routes (dict "name" (printf "market-app-cancel-%s" $tenant) "namespace" "os-framework" "account" "market-sa" "method" "POST" "path" (printf "%s/cancel$" $marketAppPath) "pathType" "RegularExpression" "userHeader" $tenant "queryParams" (list (dict "type" "Exact" "name" "type" "value" "operate"))) -}}
{{- end -}}
{{- $routes = append $routes (dict "name" (printf "user-apps-%s" $tenant) "namespace" (printf "user-system-%s" $tenant) "account" "bytetrade-sys-ops" "method" "GET" "path" (printf "/app-service/v1/user-apps/%s" $tenant)) -}}
{{- $routes = append $routes (dict "name" (printf "users-%s" $tenant) "namespace" (printf "user-system-%s" $tenant) "account" "bytetrade-sys-ops" "method" "GET" "path" "/app-service/v1/users" "userHeader" $tenant) -}}
{{- /* Creating users can assign privileged roles. Grant it only to explicitly designated administrators. */ -}}
{{- if has $tenant $userProvisioners -}}
{{- $routes = append $routes (dict "name" (printf "settings-user-create-%s" $tenant) "namespace" (printf "user-system-%s" $tenant) "account" "bytetrade-sys-ops" "method" "POST" "path" "/app-service/v1/users" "userHeader" $tenant) -}}
{{- $routes = append $routes (dict "name" (printf "settings-user-create-status-%s" $tenant) "namespace" (printf "user-system-%s" $tenant) "account" "bytetrade-sys-ops" "method" "GET" "path" "^/app-service/v1/users/[a-z0-9]([a-z0-9-]*[a-z0-9])?/status$" "pathType" "RegularExpression" "userHeader" $tenant) -}}
{{- end -}}
{{- $settingsReads := list
  (dict "name" "settings-apps" "path" "/app-service/v1/apps")
  (dict "name" "settings-compute" "path" "/app-service/v1/compute-resources")
  (dict "name" "settings-system-envs" "path" "/app-service/v1/systemenvs")
  (dict "name" "settings-user-envs" "path" "/app-service/v1/userenvs")
  (dict "name" "settings-user" "path" (printf "/app-service/v1/users/%s" $tenant))
  (dict "name" "settings-app-permissions" "path" "^/app-service/v1/perms/[a-z0-9]([a-z0-9-]*[a-z0-9])?$" "pathType" "RegularExpression")
  (dict "name" "settings-app-providers" "path" "^/app-service/v1/apps/provider-registry/[a-z0-9]([a-z0-9-]*[a-z0-9])?$" "pathType" "RegularExpression")
  (dict "name" "settings-app-entrance-reads" "path" "^/app-service/v1/applications/[a-z0-9]([a-z0-9-]*[a-z0-9])?/(entrances|setup)$" "pathType" "RegularExpression")
  (dict "name" "settings-attachments" "path" "^/app-service/v1/applications/[a-z0-9][a-z0-9-]*/(attachments|attachment-capabilities|device-inventory)$" "pathType" "RegularExpression") -}}
{{- range $read := $settingsReads -}}
{{- $routes = append $routes (dict "name" (printf "%s-%s" $read.name $tenant) "namespace" (printf "user-system-%s" $tenant) "account" "bytetrade-sys-ops" "method" "GET" "path" $read.path "pathType" (default "Exact" $read.pathType) "userHeader" $tenant) -}}
{{- end -}}
{{- /* Keep this write opt-in until the Settings and app-service logs redact environment values. The handler checks the caller's current administrator role. */ -}}
{{- if $mesh.systemEnvWrites -}}
{{- $routes = append $routes (dict "name" (printf "settings-system-envs-save-%s" $tenant) "namespace" (printf "user-system-%s" $tenant) "account" "bytetrade-sys-ops" "method" "PUT" "path" "/app-service/v1/systemenvs" "userHeader" $tenant) -}}
{{- end }}
{{- end }}
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: app-service-api
  namespace: os-framework
spec:
  podSelector:
    matchLabels:
      tier: app-service
      traffic.olares.io/app-service-api-mtls: required
  port: 6755
  proxyProtocol: HTTP/1
  accessPolicy: deny
{{- range $route := $routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $route.name }}
  namespace: os-framework
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
      name: app-service-api
  rules:
    - matches:
        - path:
            type: {{ default "Exact" $route.pathType }}
            value: {{ $route.path | quote }}
          method: {{ $route.method }}
          {{- with $route.userHeader }}
          headers:
            - name: X-Bfl-User
              type: Exact
              value: {{ . | quote }}
          {{- end }}
          {{- with $route.queryParams }}
          queryParams:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: {{ $route.name }}
  namespace: os-framework
spec:
  identityRefs:
    - kind: ServiceAccount
      name: {{ $route.account }}
      namespace: {{ $route.namespace }}
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: {{ $route.name }}
  namespace: os-framework
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ $route.name }}
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: {{ $route.name }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: olares-app-service-api-mtls-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: Namespaced
  matchConditions:
    - name: enrolled-api
      expression: >-
        request.namespace == 'os-framework' &&
        ((has(object.metadata.labels) &&
          'traffic.olares.io/app-service-api-mtls' in object.metadata.labels) ||
         (oldObject != null && has(oldObject.metadata.labels) &&
          'traffic.olares.io/app-service-api-mtls' in oldObject.metadata.labels))
  validations:
    - expression: >-
        has(object.metadata.labels) &&
        'tier' in object.metadata.labels && object.metadata.labels['tier'] == 'app-service' &&
        'traffic.olares.io/app-service-api-mtls' in object.metadata.labels &&
        object.metadata.labels['traffic.olares.io/app-service-api-mtls'] == 'required' &&
        (!has(object.spec.hostNetwork) || !object.spec.hostNetwork) &&
        object.spec.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))
      message: The app-service API enrollment must be retained without host networking.
    - expression: >-
        has(object.metadata.annotations) &&
        'linkerd.io/inject' in object.metadata.annotations &&
        object.metadata.annotations['linkerd.io/inject'] == 'enabled' &&
        'config.linkerd.io/proxy-enable-native-sidecar' in object.metadata.annotations &&
        object.metadata.annotations['config.linkerd.io/proxy-enable-native-sidecar'] == 'true' &&
        'config.linkerd.io/default-inbound-policy' in object.metadata.annotations &&
        object.metadata.annotations['config.linkerd.io/default-inbound-policy'] == 'deny' &&
        'config.linkerd.io/skip-inbound-ports' in object.metadata.annotations &&
        object.metadata.annotations['config.linkerd.io/skip-inbound-ports'] == '8433,8444' &&
        ['config.linkerd.io/skip-outbound-ports', 'config.linkerd.io/skip-subnets'].all(
          a, !(a in object.metadata.annotations) || object.metadata.annotations[a] == '')
      message: Keep API interception and preserve only the existing Webhook and JWKS port exceptions.
    - expression: >-
        has(object.spec.initContainers) && object.spec.initContainers.size() >= 2 &&
        object.spec.initContainers[0].name == 'linkerd-init' &&
        object.spec.initContainers[1].name == 'linkerd-proxy' &&
        has(object.spec.initContainers[1].restartPolicy) &&
        object.spec.initContainers[1].restartPolicy == 'Always' &&
        has(object.spec.initContainers[1].startupProbe) &&
        has(object.spec.initContainers[1].env) &&
        object.spec.initContainers[1].env.exists(e, e.name == 'LINKERD2_PROXY_INBOUND_DEFAULT_POLICY' &&
          !has(e.valueFrom) && has(e.value) && e.value == 'deny')
      message: The app-service API requires the configured native Linkerd sidecar.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: olares-app-service-api-mtls-pods
spec:
  policyName: olares-app-service-api-mtls-pods
  validationActions: [Deny, Audit]
{{- end }}
