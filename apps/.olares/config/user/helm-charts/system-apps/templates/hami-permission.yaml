---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backend:{{ .Values.bfl.username }}:system-frontend:hami-scheduler-svc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.bfl.username }}:hami-scheduler-svc
subjects:
- kind: ServiceAccount
  name: system-frontend
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backend:{{ .Values.bfl.username }}:system-frontend:hami-webui-svc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.bfl.username }}:hami-webui-svc
subjects:
- kind: ServiceAccount
  name: system-frontend
  namespace: {{ .Release.Namespace }}

# Shared Dashboard forwards a verified user token for GPU inventory.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.bfl.username }}:shared-dashboard-gpu-read
  annotations:
    provider-registry-ref: user-system-{{ .Values.bfl.username }}/hami-webui
    provider-service-ref: hami-webui.kube-system:3000
rules:
- nonResourceURLs:
  - /api/vgpu/v1/gpus
  # Provider maps HTTP POST to the Kubernetes create verb.
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: user:{{ .Values.bfl.username }}:shared-dashboard-gpu-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.bfl.username }}:shared-dashboard-gpu-read
subjects:
- kind: User
  name: {{ .Values.bfl.username }}
  apiGroup: rbac.authorization.k8s.io
