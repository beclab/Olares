# Linkerd admission webhook TLS: helm pre-install/pre-upgrade hooks.
# Order (after linkerd-pki-init weight -5):
#   -3  SA/RBAC + Mutating/ValidatingWebhookConfiguration (placeholder caBundle)
#   -2  Job writes Secrets + patches caBundle; Helm waits for Job success
# Then the main release starts linkerd-control-plane Deployments.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: linkerd-webhook-certgen
  namespace: os-mesh
  labels:
    app.kubernetes.io/name: app-gateway
    app.kubernetes.io/component: linkerd-webhook-certgen
  annotations:
    helm.sh/hook: pre-install, pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: linkerd-webhook-certgen
  namespace: os-mesh
  labels:
    app.kubernetes.io/name: app-gateway
    app.kubernetes.io/component: linkerd-webhook-certgen
  annotations:
    helm.sh/hook: pre-install, pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: linkerd-webhook-certgen
  namespace: os-mesh
  labels:
    app.kubernetes.io/name: app-gateway
    app.kubernetes.io/component: linkerd-webhook-certgen
  annotations:
    helm.sh/hook: pre-install, pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation
subjects:
  - kind: ServiceAccount
    name: linkerd-webhook-certgen
    namespace: os-mesh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: linkerd-webhook-certgen
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: linkerd-webhook-certgen
  labels:
    app.kubernetes.io/name: app-gateway
    app.kubernetes.io/component: linkerd-webhook-certgen
  annotations:
    helm.sh/hook: pre-install, pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: linkerd-webhook-certgen
  labels:
    app.kubernetes.io/name: app-gateway
    app.kubernetes.io/component: linkerd-webhook-certgen
  annotations:
    helm.sh/hook: pre-install, pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation
subjects:
  - kind: ServiceAccount
    name: linkerd-webhook-certgen
    namespace: os-mesh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: linkerd-webhook-certgen
---
# Webhook configs are hooks (EG-style) so the Job can patch caBundle before
# control-plane Deployments start. Do not also declare them in
# linkerd-control-plane.yaml.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: linkerd-proxy-injector-webhook-config
  labels:
    linkerd.io/control-plane-component: proxy-injector
    linkerd.io/control-plane-ns: os-mesh
    app.kubernetes.io/name: app-gateway
    app.kubernetes.io/component: linkerd-webhook-certgen
  annotations:
    helm.sh/hook: pre-install, pre-upgrade
    helm.sh/hook-weight: "-3"
webhooks:
- name: linkerd-proxy-injector.linkerd.io
  namespaceSelector:
    matchExpressions:
    - key: config.linkerd.io/admission-webhooks
      operator: NotIn
      values:
      - disabled
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - kube-system
      - cert-manager
  objectSelector:
    matchExpressions:
    - key: linkerd.io/control-plane-component
      operator: DoesNotExist
    - key: linkerd.io/cni-resource
      operator: DoesNotExist
  clientConfig:
    service:
      name: linkerd-proxy-injector
      namespace: os-mesh
      path: "/"
    caBundle: Cg==
  failurePolicy: Ignore
  admissionReviewVersions: ["v1", "v1beta1"]
  rules:
  - operations: [ "CREATE" ]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods", "services"]
    scope: "Namespaced"
  sideEffects: None
  timeoutSeconds: 10
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: linkerd-sp-validator-webhook-config
  labels:
    linkerd.io/control-plane-component: destination
    linkerd.io/control-plane-ns: os-mesh
    app.kubernetes.io/name: app-gateway
    app.kubernetes.io/component: linkerd-webhook-certgen
  annotations:
    helm.sh/hook: pre-install, pre-upgrade
    helm.sh/hook-weight: "-3"
webhooks:
- name: linkerd-sp-validator.linkerd.io
  namespaceSelector:
    matchExpressions:
    - key: config.linkerd.io/admission-webhooks
      operator: NotIn
      values:
      - disabled
  clientConfig:
    service:
      name: linkerd-sp-validator
      namespace: os-mesh
      path: "/"
    caBundle: Cg==
  failurePolicy: Ignore
  admissionReviewVersions: ["v1", "v1beta1"]
  rules:
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["linkerd.io"]
    apiVersions: ["v1alpha1", "v1alpha2"]
    resources: ["serviceprofiles"]
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: linkerd-policy-validator-webhook-config
  labels:
    linkerd.io/control-plane-component: destination
    linkerd.io/control-plane-ns: os-mesh
    app.kubernetes.io/name: app-gateway
    app.kubernetes.io/component: linkerd-webhook-certgen
  annotations:
    helm.sh/hook: pre-install, pre-upgrade
    helm.sh/hook-weight: "-3"
webhooks:
- name: linkerd-policy-validator.linkerd.io
  namespaceSelector:
    matchExpressions:
    - key: config.linkerd.io/admission-webhooks
      operator: NotIn
      values:
      - disabled
  clientConfig:
    service:
      name: linkerd-policy-validator
      namespace: os-mesh
      path: "/"
    caBundle: Cg==
  failurePolicy: Ignore
  admissionReviewVersions: ["v1", "v1beta1"]
  rules:
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["policy.linkerd.io"]
    apiVersions: ["*"]
    resources:
    - authorizationpolicies
    - httplocalratelimitpolicies
    - httproutes
    - networkauthentications
    - meshtlsauthentications
    - serverauthorizations
    - servers
    - egressnetworks
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["gateway.networking.k8s.io"]
    apiVersions: ["*"]
    resources:
    - httproutes
    - grpcroutes
    - tlsroutes
    - tcproutes
  sideEffects: None
---
# Install-time oneshot: per-cluster webhook TLS (100y) + caBundle sync.
# Reuses linkerd-pki-guardian image (subcommand webhook-certgen).
apiVersion: batch/v1
kind: Job
metadata:
  name: linkerd-webhook-certgen
  namespace: os-mesh
  labels:
    app.kubernetes.io/name: app-gateway
    app.kubernetes.io/component: linkerd-webhook-certgen
  annotations:
    helm.sh/hook: pre-install, pre-upgrade
    helm.sh/hook-weight: "-2"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-gateway
        app.kubernetes.io/component: linkerd-webhook-certgen
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: linkerd-webhook-certgen
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook-certgen
          image: beclab/linkerd-pki-guardian@sha256:0e45311245b70b6f2b04c0577e32f7408cfb38915e2731b82f1d55583380a83f
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/linkerd-pki-guardian
            - webhook-certgen
          env:
            - name: GUARDIAN_LINKERD_NS
              value: os-mesh
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
