---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backend:{{ .Values.bfl.username }}:system-frontend:files-provider-svc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.bfl.username }}:files-provider-svc
subjects:
- kind: ServiceAccount
  name: system-frontend
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backend:{{ .Values.bfl.username }}:system-frontend:media-server-svc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.bfl.username }}:media-server-svc
subjects:
- kind: ServiceAccount
  name: system-frontend
  namespace: {{ .Release.Namespace }}

---
# Shared Settings forwards the verified user's access token to this provider.
# Each user can read the shared video configuration through their own provider.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.bfl.username }}:settings-video-config-read
  annotations:
    provider-registry-ref: user-system-{{ .Values.bfl.username }}/files
    provider-service-ref: files-service.os-framework:80
rules:
- nonResourceURLs: ["/system/configuration/encoding"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: user:{{ .Values.bfl.username }}:settings-video-config-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.bfl.username }}:settings-video-config-read
subjects:
- kind: User
  apiGroup: rbac.authorization.k8s.io
  name: {{ .Values.bfl.username }}

---
# Video configuration is currently shared across the system.
# Every user may save it through their own authenticated provider endpoint.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.bfl.username }}:settings-video-config-write
  annotations:
    provider-registry-ref: user-system-{{ .Values.bfl.username }}/files
    provider-service-ref: files-service.os-framework:80
rules:
- nonResourceURLs: ["/system/configuration/encoding"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: user:{{ .Values.bfl.username }}:settings-video-config-write
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.bfl.username }}:settings-video-config-write
subjects:
- kind: User
  apiGroup: rbac.authorization.k8s.io
  name: {{ .Values.bfl.username }}
