apiVersion: v1
kind: ConfigMap
metadata:
  name: olares-app-nginx-config
  namespace: os-frontend
data:
  nginx.conf: |-
    user nginx;
    worker_processes 2;
    worker_rlimit_nofile 65535;
    worker_shutdown_timeout 240s;

    error_log   /var/log/nginx/error.log notice;
    pid         /var/run/nginx.pid;

    events {
        multi_accept        on;
        worker_connections 16384;
        use epoll;
    }

    http {
        aio                 threads;
        aio_write           on;
        tcp_nopush          on;
        tcp_nodelay         on;
        log_subrequest      on;
        reset_timedout_connection on;
        keepalive_timeout  75s;
        keepalive_requests 100;
        client_body_temp_path           /tmp/client-body;
        fastcgi_temp_path               /tmp/fastcgi-temp;
        proxy_temp_path                 /tmp/proxy-temp;
        client_max_body_size            1g;
        client_header_buffer_size       1k;
        client_header_timeout           60s;
        large_client_header_buffers     4 8k;
        client_body_buffer_size         8k;
        client_body_timeout             60s;
        types_hash_max_size             2048;
        server_names_hash_max_size      4096;
        server_names_hash_bucket_size   1024;
        map_hash_bucket_size            64;
        proxy_headers_hash_max_size     512;
        proxy_headers_hash_bucket_size  64;
        variables_hash_bucket_size      256;
        variables_hash_max_size         2048;
        underscores_in_headers          off;
        ignore_invalid_headers          on;
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;
        proxy_ssl_session_reuse on;

        sendfile        on;
        include /etc/nginx/resolver.conf;
        resolver_timeout        30s;
        send_timeout            60s;

        map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
        }

        include /etc/nginx/conf.d/*.conf;
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: olares-app-routes
  namespace: os-frontend
data:
  headscale.conf: |-
    server {
        listen 85;
        # Gzip Settings
        gzip on;
        gzip_disable "msie6";
        gzip_min_length 1k;
        gzip_buffers 16 64k;
        gzip_http_version 1.1;
        gzip_comp_level 6;
        gzip_types *;
        index index.html;
        location /ts2021 {
          proxy_pass http://headscale-server-svc.os-network:8080;
          proxy_method POST;
          proxy_http_version 1.1;
          proxy_set_header Upgrade 'tailscale-control-protocol';
          proxy_set_header Connection '$connection_upgrade';
          more_set_headers 'Upgrade: $http_upgrade';
        }
        location /api/refresh {
          add_header Access-Control-Allow-Headers "access-control-allow-headers,access-control-allow-methods,access-control-allow-origin,content-type,x-auth,x-unauth-error,x-authorization";
          add_header Access-Control-Allow-Methods "PUT, GET, DELETE, POST, OPTIONS";
          add_header Access-Control-Allow-Origin $http_origin;
          add_header Access-Control-Allow-Credentials true;
          proxy_pass http://authelia-backend.os-framework:9091;
          proxy_set_header            Host $host;
          proxy_set_header            X-real-ip $remote_addr;
          proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
          add_header X-Frame-Options SAMEORIGIN;
        }
        location / {
          proxy_pass http://headscale-server-svc.os-network:8080;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection '$connection_upgrade';
        }
    }
  legacy-providers.conf: |-
    # These provider services have no shared replacement yet. Resolve them on
    # demand so they do not block installation before any user exists. Keep
    # these routes behind providers; do not bypass authorization via backends.
    map "" $legacy_monitoring { default monitoring.os-frontend.svc.cluster.local:28080; }
    map "" $legacy_infisical { default infisical.os-frontend.svc.cluster.local:28080; }
    map "" $legacy_backup { default backup.os-frontend.svc.cluster.local:28080; }
    map "" $legacy_middleware { default middleware.os-frontend.svc.cluster.local:28080; }
    map "" $legacy_vault { default vault.os-frontend.svc.cluster.local:28080; }
    map "" $legacy_bfl { default bfl.os-frontend.svc.cluster.local:80; }
    map "" $legacy_auth_frontend { default authelia-svc.os-frontend.svc.cluster.local:80; }
