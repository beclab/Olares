# Projection of Chart/OTA SSOT (ADR-SYS-UNIAUTH-CONFIG-01). Not a secret.
# Integrity: labeled + admission-guarded; mutate only via installer/OTA.
# Emergency rollback: OTA sets endState=false (or pod env override) then restart consumers.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: olares-http-mesh-wave
  namespace: os-gateway
  labels:
    app.kubernetes.io/name: http-mesh-wave
    app.kubernetes.io/part-of: uniauth
    olares.io/uniauth-posture: "true"
  annotations:
    olares.io/config-integrity: "release-controlled"
data:
  endState: "true"
  wave: "4"
  trafficGroupNP: "true"
  l4AppGatewayMTLS: "true"
  entryMTLSPki: "true"
  policyCompilation: "true"
