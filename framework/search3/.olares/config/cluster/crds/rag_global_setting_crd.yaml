apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ragglobalsettings.sys.bytetrade.search3
spec:
  group: sys.bytetrade.search3
  names:
    categories: []
    kind: RagGlobalSetting
    plural: ragglobalsettings
    shortNames: []
    singular: ragglobalsetting
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for RagGlobalSettingSpec via `CustomResource`
        properties:
          spec:
            description: |-
              The one system-wide RAG policy selected from Search3's controlled catalog.

              The five catalog selections are required on the wire. Values are stable keys, not free-form endpoints. `retrieval_parameters` is the only optional object: it is required for `hybrid-weighted-v1`, forbidden for the default profile, and contains only the bounded query-time values accepted by ADR-0008.
            properties:
              chunkPolicy:
                enum:
                - structured-512-50-v1
                type: string
              embeddingModel:
                description: Embedding models implemented and tested by this Search3 release.
                enum:
                - embedding-gemma-2-v1
                type: string
              parserProfile:
                enum:
                - text-family-v1
                type: string
              rerankModel:
                description: Rerank models implemented by Search3. Disabled remains an explicit choice.
                enum:
                - rerank-disabled-v1
                - bge-reranker-v2-m3-v1
                type: string
              retrievalParameters:
                additionalProperties: false
                description: Bounded query-only parameters. They never enter `RagIndexSignature`.
                nullable: true
                properties:
                  scoreCalibration:
                    description: Versioned calibration used before combining lexical and vector evidence. A new mathematical meaning requires a new enum value, not an in-place edit.
                    enum:
                    - rank-percentile-v1
                    type: string
                  vectorWeightPercent:
                    format: uint8
                    maximum: 100.0
                    minimum: 0.0
                    type: integer
                required:
                - scoreCalibration
                - vectorWeightPercent
                type: object
              retrievalProfile:
                enum:
                - vector-default-v1
                - hybrid-weighted-v1
                type: string
            required:
            - chunkPolicy
            - embeddingModel
            - parserProfile
            - rerankModel
            - retrievalProfile
            type: object
          status:
            description: Controller-owned application status. `Unavailable` means the desired catalog choice is valid but a selected model service is not currently ready; it is deliberately different from an invalid specification.
            nullable: true
            properties:
              message:
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              phase:
                description: '`Valid`, `Invalid`, or `Unavailable`. No worker lifecycle is stored here.'
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: RagGlobalSetting
        type: object
    served: true
    storage: true
    subresources:
      status: {}
