name: App-Service Unit Tests
on:
  push:
    branches:
      - "main"
    paths:
      - 'framework/app-service/**'
      - '!framework/app-service/README.md'
      - '!framework/app-service/PROJECT'
  pull_request:
    branches:
      - "main"
    paths:
      - 'framework/app-service/**'
      - '!framework/app-service/README.md'
      - '!framework/app-service/PROJECT'
jobs:
  test-unit:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/beclab/oac
      GONOSUMDB: github.com/beclab/oac
      GONOPROXY: github.com/beclab/oac
      # Prefer GIT_CONFIG_* over `git config --global` so the PAT is never
      # written to ~/.gitconfig on the runner.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com/.insteadof"
      GIT_CONFIG_VALUE_0: "https://github.com/"
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs libbtrfs-dev
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: framework/app-service/go.sum
      - name: Cache envtest binaries
        uses: actions/cache@v4
        with:
          path: ~/.local/share/io.kubebuilder.envtest
          key: ${{ runner.os }}-envtest-k8s-1.24.2
      - name: Run unit + integration tests (race detector)
        run: make test-unit
        working-directory: framework/app-service
