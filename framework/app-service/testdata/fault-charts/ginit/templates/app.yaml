apiVersion: apps/v1
kind: Deployment
metadata:
  name: ginit
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.workloads.ginit.replicaCount }}
  selector:
    matchLabels:
      app: ginit
  template:
    metadata:
      labels:
        app: ginit
      annotations:
        linkerd.io/inject: disabled
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      containers:
        - name: ginit
          image: docker.io/library/python:3.12-slim
          command: ["sh", "-c", "sleep 55 && python -m http.server 80"]
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ginit-svc
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: ginit
  ports:
    - name: http
      port: 80
      targetPort: 80
