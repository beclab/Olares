# Shared user-service reads templates using the authenticated user's access token.
# Keep template administration and other notification operations outside this role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.bfl.username }}:notification-template-reader
  annotations:
    provider-registry-ref: user-system-{{ .Values.bfl.username }}/notifications-server
    provider-service-ref: notifications-server.os-framework:80
rules:
- nonResourceURLs:
  - "/notification/findTemplateByName"
  verbs: ["post"]
- nonResourceURLs:
  - "/notification/templateContent/*"
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backend:{{ .Values.bfl.username }}:notification-template-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.bfl.username }}:notification-template-reader
subjects:
- kind: User
  apiGroup: rbac.authorization.k8s.io
  name: {{ .Values.bfl.username }}
