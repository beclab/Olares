# One shared Headscale control plane and one Tailscale node for Olares.
#
# This template is packaged into the os-framework system chart for normal
# Olares installation and upgrades. All workload resources deliberately remain
# in os-network.
#
# Namespace/os-network and the shared l4-bfl-proxy are intentionally not part
# of this manifest. Removing these workloads must not delete system networking
# resources.
#
# Inspect:
#   kubectl -n os-network get pods -l 'app in (headscale,tailscale)' -o wide
#   kubectl -n os-network exec deploy/headscale -- headscale nodes list
#   kubectl -n os-network exec deploy/tailscale -c tailscale -- tailscale status
#
# This expects the existing Olares L4 entrypoint to be healthy so HTTPS traffic
# received on the shared Tailscale address can reach normal application routing.
# LarePass key issuance is provided by the unified API wrapper after it verifies
# the Olares session identity.
# ACL groups reserve independently controlled subnet-route and exit-node access.
# Membership starts empty and is maintained only by the authenticated control
# path. Headscale users are reconciled from LLDAP, but synchronization never
# grants policy membership or other authorization.
# Shared-node state and the bootstrap handoff use control-plane-node storage so
# Pod replacement preserves the Tailscale identity and route configuration.
# Enrollment keys are fetched on startup and are never stored in this directory.
# PostgreSQL is provisioned through the existing Olares middleware controller.
# Helm generates the password on first install and reuses the existing Secret on
# upgrades, matching the previous per-user Headscale chart.

{{- $resourceNamespace := "os-network" }}
{{- $secretName := "headscale-postgres-secret" }}
{{- $existingSecret := lookup "v1" "Secret" $resourceNamespace $secretName }}
{{- $pgPassword := "" }}
{{- if $existingSecret }}
{{- $pgPassword = index $existingSecret "data" "pg_password" }}
{{- else }}
{{- $pgPassword = randAlphaNum 32 | b64enc }}
{{- end }}
{{- $natsSecretName := "headscale-user-sync-nats-secret" }}
{{- $existingNatsSecret := lookup "v1" "Secret" $resourceNamespace $natsSecretName }}
{{- $natsPassword := "" }}
{{- if $existingNatsSecret }}
{{- $natsPassword = index $existingNatsSecret "data" "nats_password" }}
{{- else }}
{{- $natsPassword = randAlphaNum 32 | b64enc }}
{{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $resourceNamespace }}
  labels:
    app: headscale
type: Opaque
data:
  pg_password: {{ $pgPassword | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $natsSecretName }}
  namespace: {{ $resourceNamespace }}
  labels:
    app: headscale
type: Opaque
data:
  nats_password: {{ $natsPassword | quote }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headscale-dns-renderer
  namespace: os-network
  labels:
    app: headscale
automountServiceAccountToken: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale
  namespace: os-network
  labels:
    app: tailscale

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headscale-dns-renderer
  labels:
    app: headscale
rules:
  # Olares User objects are cluster-scoped. The API wrapper gets individual
  # Users for owner-only operations and lists/watches their zones to publish
  # the split DNS JSON file.
  - apiGroups: ["iam.kubesphere.io"]
    resources: ["users"]
    verbs: ["get", "list", "watch"]
  # The API wrapper authenticates Tailscale bootstrap requests with TokenReview.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headscale-dns-renderer
  labels:
    app: headscale
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headscale-dns-renderer
subjects:
  - kind: ServiceAccount
    name: headscale-dns-renderer
    namespace: os-network

---
apiVersion: apr.bytetrade.io/v1alpha1
kind: MiddlewareRequest
metadata:
  name: headscale-pg
  namespace: os-network
  labels:
    app: headscale
spec:
  app: headscale
  appNamespace: os-network
  middleware: postgres
  postgreSQL:
    user: headscale
    password:
      valueFrom:
        secretKeyRef:
          name: {{ $secretName }}
          key: pg_password
    databases:
      - name: headscale

---
apiVersion: apr.bytetrade.io/v1alpha1
kind: MiddlewareRequest
metadata:
  name: headscale-user-sync-nats
  namespace: os-network
  labels:
    app: headscale
spec:
  app: headscale-user-sync
  appNamespace: os
  middleware: nats
  nats:
    user: os-headscale-user-sync
    password:
      valueFrom:
        secretKeyRef:
          name: {{ $natsSecretName }}
          key: nats_password
    subjects:
      # Enables the standard JetStream API permissions added by tapr without
      # granting publication to the account lifecycle subjects.
      - name: headscale-user-sync.control
        permission:
          pub: allow
          sub: deny
    refs:
      - appName: app-service
        appNamespace: os
        subjects:
          - name: users
            sub: allow

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
  namespace: os-network
  labels:
    app: headscale
data:
  config.yaml.tpl: |
    # The renderer replaces this with the public shared Headscale URL after
    # the primary Olares DNS zone is bound.
    server_url: __HEADSCALE_SERVER_URL__
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 0.0.0.0:9090
    grpc_listen_addr: 127.0.0.1:50443
    grpc_allow_insecure: false

    noise:
      private_key_path: /var/lib/headscale/noise_private.key

    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48
      allocation: sequential

    derp:
      server:
        enabled: false
        region_id: 999
        region_code: olares
        region_name: Olares
        verify_clients: true
        stun_listen_addr: 0.0.0.0:3478
        private_key_path: /var/lib/headscale/derp_server_private.key
        automatically_add_embedded_derp_region: false
      urls:
        - https://api.olares.com/controlplane/derpmap/default
      paths: []
      auto_update_enabled: true
      update_frequency: 3h

    disable_check_updates: true
    node:
      expiry: 0
      ephemeral:
        inactivity_timeout: 30m

    database:
      type: postgres
      debug: false
      gorm:
        prepare_stmt: true
        parameterized_queries: true
        skip_err_record_not_found: true
        slow_threshold: 1000
      postgres:
        host: citus-master-svc.os-platform
        port: 5432
        name: os_network_headscale
        user: headscale
        # Injected through HEADSCALE_DATABASE_POSTGRES_PASS below.
        pass: ""
        max_open_conns: 10
        max_idle_conns: 10
        conn_max_idle_time_secs: 3600
        ssl: false

    tls_cert_path: ""
    tls_key_path: ""

    log:
      level: info
      format: text

    policy:
      mode: database

    # The wrapper publishes User zones and the shared-node IPv4 as JSON.
    # The Headscale fork hot-loads it without restarting the container.
    dns:
      magic_dns: false
      base_domain: olares.internal
      override_local_dns: false
      nameservers:
        global: []
        split: {}
      search_domains: []
      extra_records: []
      # Requires the Headscale fork with split DNS file watching. This must
      # match the API wrapper's SPLIT_DNS_RESOLVERS_FILE below.
      split_resolvers_path: /var/lib/headscale/bootstrap/split-resolvers.json

    unix_socket: /var/run/headscale/headscale.sock
    unix_socket_permission: "0770"

    logtail:
      enabled: false
    taildrop:
      enabled: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-nginx-config
  namespace: os-network
  labels:
    app: headscale
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
    }

    server {
      listen 8443 ssl;
      ssl_certificate /etc/nginx/certs/tls.crt;
      ssl_certificate_key /etc/nginx/certs/tls.key;

      location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
      }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tailscale-dns
  namespace: os-network
  labels:
    app: tailscale
data:
  Corefile: |
    .:53 {
        # Bind only to the Tailnet interface. This avoids exposing DNS on every
        # host interface and avoids colliding with the node's existing port 53.
        bind ts-olares
        errors
        # Keep stale-address exposure short if the infrastructure node is
        # deleted and re-registers with a different Tailnet IP.
        cache 5
        reload 2s

        # Headscale sends the Olares split zones maintained by the wrapper
        # and hot-loaded from JSON. Every query that reaches this resolver therefore belongs to
        # this Olares instance and resolves to its shared ingress node. The L4
        # proxy selects the actual user/application using SNI or Host.
        template IN A {
            answer "{{`{{ .Name }}`}} 5 IN A __TAILSCALE_DNS_IP__"
        }
        template IN ANY {
            rcode NOERROR
        }
    }

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headscale-ingress
  namespace: os-network
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    app: headscale
    # The Olares security reconciler prunes unknown NetworkPolicies. These are
    # the existing labels it uses for externally managed route policies that
    # must survive the namespace policy reconciliation loop.
    app.kubernetes.io/managed-by: app-service
    app.kubernetes.io/component: route-control
spec:
  podSelector:
    matchLabels:
      app: headscale
  policyTypes:
    - Ingress
  ingress:
    # Each user's olares-app forwards Headscale control traffic on 8080.
    - from:
        - namespaceSelector:
            matchLabels:
              bytetrade.io/ns-type: user-space
          podSelector:
            matchLabels:
              app: olares-app
      ports:
        - protocol: TCP
          port: 8080
    # The authenticated /server provider runs in vault-server. It is the
    # effective caller that requests a pre-auth key from the wrapper.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: os-framework
          podSelector:
            matchLabels:
              app: vault-server
      ports:
        - protocol: TCP
          port: 9000
    # Per-user system-server instances authenticate and authorize Settings
    # provider requests before forwarding them to the management API.
    - from:
        - namespaceSelector:
            matchLabels:
              bytetrade.io/ns-type: user-internal
          podSelector:
            matchLabels:
              app: systemserver
      ports:
        - protocol: TCP
          port: 8000
    # app-service is the only writer of the application-owned port set.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: os-framework
          podSelector:
            matchLabels:
              tier: app-service
      ports:
        - protocol: TCP
          port: 8001

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headscale-postgres-ingress
  namespace: os-platform
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    app: headscale
    app.kubernetes.io/managed-by: app-service
    app.kubernetes.io/component: route-control
spec:
  podSelector:
    matchLabels:
      app: citus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: os-network
          podSelector:
            matchLabels:
              app: headscale
      ports:
        - protocol: TCP
          port: 5432

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headscale-nats-ingress
  namespace: os-platform
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    app: headscale
    app.kubernetes.io/managed-by: app-service
    app.kubernetes.io/component: route-control
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/instance: nats
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: os-network
          podSelector:
            matchLabels:
              app: headscale
      ports:
        - protocol: TCP
          port: 4222

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headscale-lldap-ingress
  namespace: os-platform
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    app: headscale
    app.kubernetes.io/managed-by: app-service
    app.kubernetes.io/component: route-control
spec:
  podSelector:
    matchLabels:
      app: lldap
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: os-network
          podSelector:
            matchLabels:
              app: headscale
      ports:
        - protocol: TCP
          port: 17170
        - protocol: TCP
          port: 17171
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: os-network
  labels:
    app: headscale
    applications.app.bytetrade.io/author: bytetrade.io
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
    spec:
      serviceAccountName: headscale-dns-renderer
      # Keep the standard Kubernetes service-account mount, matching the
      # existing Headscale deployment and kubectl's in-cluster discovery.
      automountServiceAccountToken: true
      priorityClassName: system-cluster-critical
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values: [linux]
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: render-dns-config
          image: busybox:1.28
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              rendered=/etc/headscale-runtime/config.yaml.tpl
              headscale_server_url=https://headscale-server-svc.os-network.svc.cluster.local
              # Global zone only selects server_url; wrapper owns split DNS.
              valid_zone() {
                zone="$(printf '%s' "$1" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | tr 'A-Z' 'a-z')"
                test "${#zone}" -le 253 || return 1
                label='[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?'
                printf '%s\n' "${zone}" | grep -Eqx "${label}(\.${label})+" || return 1
                printf '%s\n' "${zone}"
              }
              if test -n "${OLARES_DNS_ZONE}"; then
                raw_zones=/etc/headscale-runtime/server-url-zones
                trap 'rm -f "${raw_zones}"' EXIT
                printf '%s\n' "${OLARES_DNS_ZONE}" | tr ',' '\n' > "${raw_zones}"
                primary_zone=""
                while IFS= read -r zone; do
                  zone="$(printf '%s' "$zone" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
                  test -n "${zone}" || continue
                  if ! normalized_zone="$(valid_zone "${zone}")"; then
                    echo "invalid Olares DNS zone annotation: ${OLARES_DNS_ZONE}" >&2
                    exit 1
                  fi
                  test -n "${primary_zone}" || primary_zone="${normalized_zone}"
                done < "${raw_zones}"
                test -n "${primary_zone}" || { echo "empty Olares DNS zone annotation" >&2; exit 1; }
                headscale_server_url="https://headscale.${primary_zone}"
              fi
              sed "s|__HEADSCALE_SERVER_URL__|${headscale_server_url}|g" \
                /etc/headscale-template/config.yaml.tpl > "${rendered}.tmp"
              mv "${rendered}.tmp" "${rendered}"
          env:
            - name: OLARES_DNS_ZONE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['bytetrade.io/zone']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: config
              mountPath: /etc/headscale-template
              readOnly: true
            - name: config-runtime
              mountPath: /etc/headscale-runtime
        - name: wait-for-postgres
          image: postgres:16.0-alpine3.18
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              until psql -c 'SELECT 1' >/dev/null 2>&1; do
                echo "waiting for PostgreSQL at ${PGHOST}:${PGPORT}/${PGDATABASE}"
                sleep 2
              done
          env:
            - name: PGHOST
              value: citus-master-svc.os-platform
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: os_network_headscale
            - name: PGUSER
              value: headscale
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: pg_password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70
        - name: init-cert
          image: alpine/openssl:3.5.5
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              if ! test -s /certs/tls.crt || ! test -s /certs/tls.key || ! test -s /certs/ca.crt; then
                echo "generating the internal Headscale TLS certificate"
                openssl req -x509 -newkey rsa:4096 -nodes \
                  -keyout /certs/tls.key \
                  -out /certs/tls.crt \
                  -days 36500 \
                  -subj "/CN=headscale-server-svc" \
                  -addext "subjectAltName=DNS:headscale-server-svc,DNS:headscale-server-svc.os-network,DNS:headscale-server-svc.os-network.svc,DNS:headscale-server-svc.os-network.svc.cluster.local"
                cp /certs/tls.crt /certs/ca.crt
              fi
              chown 1000:1000 /certs/tls.crt /certs/tls.key /certs/ca.crt
              chmod 0644 /certs/tls.crt /certs/ca.crt
              chmod 0600 /certs/tls.key
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: tls-cert
              mountPath: /certs
        - name: init-data
          image: busybox:1.28
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              mkdir -p /var/lib/headscale/bootstrap /var/run/headscale
              chown -R 1000:1000 /var/lib/headscale /var/run/headscale
              # Tailscale runs as uid 0 without CAP_DAC_OVERRIDE. Its pod
              # fsGroup is 1000, so group write is enough to publish tailscale.ip
              # and group read is enough to load subnet routes.
              chmod 0770 /var/lib/headscale/bootstrap
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: headscale-data
              mountPath: /var/lib/headscale
            - name: headscale-run
              mountPath: /var/run/headscale
      containers:
        - name: headscale
          image: beclab/headscale:v0.29.7-olares.1-debug
          imagePullPolicy: IfNotPresent
          command: [/busybox/sh, -ec]
          args:
            - |
              rm -f /var/run/headscale/policy.ready
              cp /etc/headscale/config.yaml.tpl /etc/headscale/config.yaml.tmp
              mv /etc/headscale/config.yaml.tmp /etc/headscale/config.yaml
              exec /ko-app/headscale serve
          env:
            - name: HEADSCALE_CONFIG
              value: /etc/headscale/config.yaml
            - name: HEADSCALE_DATABASE_POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: pg_password
          lifecycle:
            postStart:
              exec:
                command:
                  - /busybox/sh
                  - -ec
                  - |
                    (
                      export NO_COLOR=1
                      for i in $(seq 1 300); do
                        test -S /var/run/headscale/headscale.sock && break
                        sleep 1
                      done
                      test -S /var/run/headscale/headscale.sock

                      # PostgreSQL is the policy source of truth. Seed a fresh
                      # database exactly once; Pod restarts and chart upgrades
                      # must never overwrite policy updated through the API.
                      policy_state=unknown
                      for attempt in 1 2 3 4 5; do
                        if policy_error="$(/busybox/timeout 10 /ko-app/headscale policy get 2>&1 >/dev/null)"; then
                          policy_state=exists
                          break
                        fi
                        # Match the terminal missing-policy cause, independent of
                        # gRPC/HTTP wrappers, and only after a failed query.
                        # Transport/DB errors must never reset ACLs.
                        if printf '%s\n' "$policy_error" | /busybox/grep -Eq '(^|:[[:space:]]*)acl policy not found$'; then
                          policy_state=missing
                          break
                        fi
                        echo "Headscale policy query failed (attempt $attempt/5); refusing to initialize policy: $policy_error" >&2
                        if test "$attempt" -lt 5; then sleep 2; fi
                      done
                      if test "$policy_state" = unknown; then
                        echo "cannot determine Headscale policy state; leaving existing policy unchanged" >&2
                        exit 1
                      fi
                      if test "$policy_state" = exists; then
                        echo "Headscale database policy already exists"
                      else
                        echo "initializing Headscale database policy"
                        bootstrap_policy="$(/busybox/cat <<'POLICY_EOF'
                    {
                      // Membership is maintained through authenticated
                      // control-plane updates. LLDAP synchronization creates
                      // identities but never grants user capabilities.
                      "groups": {
                        "group:admins": [],
                        "group:self-mesh": [],
                        "group:subnet-users": [],
                        "group:exit-users": []
                      },
                      "acls": [
                        {
                          // Shared Olares services available to every user.
                          // TCP 53 supports DNS responses truncated over UDP.
                          "action": "accept",
                          "src": ["autogroup:member"],
                          "proto": "tcp",
                          "dst": ["tag:olares:80,443,53,18088"]
                        },
                        {
                          "action": "accept",
                          "src": ["autogroup:member"],
                          "proto": "udp",
                          "dst": ["tag:olares:53"]
                        },
                        {
                          "action": "accept",
                          "src": ["autogroup:member"],
                          "proto": "icmp",
                          "dst": ["tag:olares:*"]
                        },
                        {
                          // Members may access devices owned by themselves.
                          "action": "accept",
                          "src": ["group:self-mesh"],
                          "dst": ["autogroup:self:*"]
                        },
                        {
                          // Exit-node access is independent from subnet access.
                          "action": "accept",
                          "src": ["group:exit-users"],
                          "dst": ["autogroup:internet:*"]
                        },
                        {
                          // Existing LarePass clients identify the shared
                          // Olares node through this PrimaryRoutes marker.
                          "action": "accept",
                          "src": ["autogroup:member"],
                          "dst": ["10.255.255.254/32:*"]
                        }
                      ],
                      "tagOwners": {
                        "tag:olares": ["group:admins"]
                      },
                      "autoApprovers": {
                        "routes": {
                          "10.255.255.254/32": ["tag:olares"]
                        },
                        "exitNode": ["tag:olares"]
                      }
                    }
                    POLICY_EOF
                    )"
                        printf '%s\n%s\n%s\n' \
                          '----- Headscale bootstrap policy -----' \
                          "${bootstrap_policy}" \
                          '----- end bootstrap policy -----'
                        printf '%s\n' "${bootstrap_policy}" \
                          | /ko-app/headscale policy set --file /dev/stdin
                      fi
                      touch /var/run/headscale/policy.ready

                      # Reuse the per-Pod key across container restarts.
                      # Invalid credentials are recovered by recreating the Pod.
                      runtime_key=/var/run/headscale-auth/headscale.apikey
                      if ! test -s "$runtime_key"; then
                        umask 077
                        rm -f "${runtime_key}.tmp"
                        /busybox/timeout 10 /ko-app/headscale apikeys create \
                          --expiration 87600h > "${runtime_key}.tmp"
                        test -s "${runtime_key}.tmp"
                        chmod 0600 "${runtime_key}.tmp"
                        mv "${runtime_key}.tmp" "$runtime_key"
                      fi

                    ) > /var/lib/headscale/bootstrap/bootstrap.log 2>&1
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /busybox/sh
                - -ec
                - |
                  test -S /var/run/headscale/headscale.sock
                  test -f /var/run/headscale/policy.ready
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - /busybox/sh
                - -ec
                - |
                  test -S /var/run/headscale/headscale.sock
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: config-runtime
              mountPath: /etc/headscale
            - name: headscale-data
              mountPath: /var/lib/headscale
            - name: headscale-run
              mountPath: /var/run/headscale
            - name: api-key-runtime
              mountPath: /var/run/headscale-auth
        - name: headscale-nginx-https
          image: nginxinc/nginx-unprivileged:1.29.5-alpine3.23
          imagePullPolicy: IfNotPresent
          command: [nginx, -g, "daemon off;"]
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: tls-cert
              mountPath: /etc/nginx/certs
              readOnly: true
            - name: headscale-nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
        - name: headscale-api-wrapper
          image: beclab/headscale-api-wrapper:v0.2.7
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              key_file=/var/run/headscale-auth/headscale.apikey
              until test -s "$key_file"; do
                echo "waiting for the Headscale API-wrapper key"
                sleep 2
              done
              APIKEY="$(cat "$key_file")"
              export APIKEY
              exec /headscale-api-wrapper \
                --host 127.0.0.1 \
                --port 8080 \
                --config /etc/headscale/config.yaml
          ports:
            - name: management
              containerPort: 8000
              protocol: TCP
            - name: policy
              containerPort: 8001
              protocol: TCP
            - name: authkey
              containerPort: 9000
              protocol: TCP
          env:
            - name: TOKEN_VERIFY_URL
              value: http://lldap-service.os-platform:17170/auth/token/verify
            - name: LLDAP_READONLY_URL
              value: http://lldap-service.os-platform:17171
            - name: HEADSCALE_USER_SYNC_INTERVAL
              value: 30s
            - name: NATS_URL
              value: nats://nats.os-platform:4222
            - name: NATS_USERNAME
              value: os-headscale-user-sync
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $natsSecretName }}
                  key: nats_password
            - name: NATS_STREAM
              value: os-stream
            - name: NATS_DURABLE
              value: headscale-users
            - name: SUBNET_ROUTES_FILE
              value: /var/lib/headscale/bootstrap/subnet-routes
            # Requires the wrapper image with JSON split DNS publication.
            # Both containers map this directory to the same hostPath.
            - name: SPLIT_DNS_RESOLVERS_FILE
              value: /var/lib/headscale/bootstrap/split-resolvers.json
            - name: TAILSCALE_IP_FILE
              value: /var/lib/headscale/bootstrap/tailscale.ip
            # Keep these aligned with the fixed Linux installation defaults.
            - name: OLARES_CLUSTER_CIDRS
              value: "10.233.64.0/18,10.233.0.0/18"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: config-runtime
              mountPath: /etc/headscale
              readOnly: true
            - name: api-key-runtime
              mountPath: /var/run/headscale-auth
              readOnly: true
            - name: headscale-bootstrap
              mountPath: /var/lib/headscale/bootstrap
      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: config-runtime
          emptyDir: {}
        - name: headscale-nginx-config
          configMap:
            name: headscale-nginx-config
        - name: tls-cert
          hostPath:
            path: /var/lib/olares/headscale/certs
            type: DirectoryOrCreate
        - name: headscale-run
          emptyDir: {}
        - name: api-key-runtime
          emptyDir:
            medium: Memory
        - name: headscale-data
          hostPath:
            path: /var/lib/olares/headscale
            type: DirectoryOrCreate
        - name: headscale-bootstrap
          hostPath:
            path: /var/lib/olares/headscale/bootstrap
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: headscale-server-svc
  namespace: os-network
  labels:
    app: headscale
spec:
  type: ClusterIP
  selector:
    app: headscale
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: metrics
    - name: https
      protocol: TCP
      port: 443
      targetPort: https
    - name: management
      protocol: TCP
      port: 8000
      targetPort: management
    - name: policy
      protocol: TCP
      port: 8001
      targetPort: policy
---
apiVersion: v1
kind: Service
metadata:
  name: headscale-authkey-svc
  namespace: os-network
  labels:
    app: headscale
spec:
  type: ClusterIP
  selector:
    app: headscale
  ports:
    - name: authkey
      protocol: TCP
      port: 9000
      targetPort: authkey

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale
  namespace: os-network
  labels:
    app: tailscale
    applications.app.bytetrade.io/author: bytetrade.io
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tailscale
  template:
    metadata:
      labels:
        app: tailscale
    spec:
      priorityClassName: system-cluster-critical
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: tailscale
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: headscale
              topologyKey: kubernetes.io/hostname
      initContainers:
        # Sidecar so dns-proxy is not started until ts-olares exists. CoreDNS
        # resolves `bind` once, at process start, and exits if the interface
        # is missing. restartPolicy Always keeps tailscaled running after the
        # startup probe passes.
        - name: tailscale
          restartPolicy: Always
          image: tailscale/tailscale:v1.104.4
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              # emptyDir survives container restarts; discard any previous key first.
              rm -f /var/run/tailscale-auth/authkey
              until test -s /certs/ca.crt; do
                echo "waiting for the Headscale TLS CA"
                sleep 1
              done
              cp /certs/ca.crt /usr/local/share/ca-certificates/headscale-ca.crt
              update-ca-certificates
              bootstrap_timeout=30
              if ! grep -q '"_current-profile"[[:space:]]*:' /var/lib/tailscale/tailscaled.state 2>/dev/null; then
                # A state file alone does not imply enrollment; allow longer without a profile.
                bootstrap_timeout=120
              fi
              # Requests may overrun the deadline. Never log credentials or response bodies.
              deadline=$(( $(date +%s) + bootstrap_timeout ))
              while test "$(date +%s)" -lt "${deadline}"; do
                if authkey="$(wget -q -T 5 -O - --post-data="" \
                  --header="Authorization: Bearer $(cat /var/run/secrets/tokens/bootstrap)" \
                  http://headscale-server-svc.os-network.svc.cluster.local:8000/bootstrap/tailscale-authkey 2>/dev/null)" &&
                  test -n "${authkey}"; then
                  break
                fi
                # A failed transfer may leave partial output.
                authkey=""
                sleep 2
              done
              if test -n "${authkey}"; then
                # Keep the secret out of argv and the exported environment.
                (umask 077; printf '%s' "${authkey}" > /var/run/tailscale-auth/authkey)
                export TS_AUTHKEY=file:/var/run/tailscale-auth/authkey
              else
                echo "bootstrap key unavailable (wait limit ${bootstrap_timeout}s); trying persisted Tailscale login"
              fi
              unset authkey
              exec /usr/local/bin/containerboot
          env:
            - name: TS_DISABLE_TAILDROP
              value: "true"
            - name: TS_DEBUG_FIREWALL_MODE
              value: nftables
            - name: TS_SOCKET
              value: /var/run/tailscale/tailscaled.sock
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_HOSTNAME
              value: olares
            - name: TS_USERSPACE
              value: "false"
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_TAILSCALED_EXTRA_ARGS
              value: >-
                --no-logs-no-support
                --verbose=1
                --tun=ts-olares
            - name: TS_EXTRA_ARGS
              value: >-
                --reset
                --login-server=https://headscale-server-svc.os-network.svc.cluster.local
                --netfilter-mode=on
                --advertise-exit-node
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN, NET_RAW]
          volumeMounts:
            - name: bootstrap-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - name: bootstrap-authkey
              mountPath: /var/run/tailscale-auth
            - name: tailscale-data
              mountPath: /var/lib/tailscale
            - name: tailscale-run
              mountPath: /var/run/tailscale
            - name: tun
              mountPath: /dev/net/tun
            - name: tls-cert
              mountPath: /certs
              readOnly: true
          # Hold dns-proxy until tailscaled has created ts-olares. The entrypoint
          # can wait for the CA and bootstrap API before that device exists;
          # keep the failure window longer than Headscale's own bootstrap.
          startupProbe:
            exec:
              command: ["/sbin/ip", "link", "show", "ts-olares"]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 180
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  tailscale status --json >/dev/null &&
                  test -n "$(tailscale ip -4 | head -n 1)"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
        # Sidecar so dns-proxy starts only after the Corefile carries the
        # actual Tailnet address. This loop is the only Corefile writer, and
        # dns-runtime starts empty in every Pod.
        - name: tailscale-sync
          restartPolicy: Always
          image: tailscale/tailscale:v1.104.4
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              # This shell is PID 1. Handle termination explicitly so shutdown
              # can proceed to the tailscale sidecar without exhausting the
              # Pod grace period. In-flight CLI calls have bounded timeouts.
              trap 'exit 0' TERM INT
              failures=0
              read_failures=0
              prefs_failures=0
              exit_node_configured=false
              exit_node_failures=0
              sync_exit_node() {
                # AuthOnce does not reapply TS_EXTRA_ARGS for persisted identities.
                # Retry independently of DNS and subnet-file failures; configure
                # once per sync-container lifetime without blocking Pod startup.
                if test "$exit_node_configured" = true; then return 0; fi
                if exit_output=$(timeout 5 tailscale set --advertise-exit-node=true 2>&1); then
                  exit_node_configured=true
                  exit_node_failures=0
                  echo "enabled shared Tailscale exit-node advertisement"
                else
                  exit_status=$?
                  exit_node_failures=$((exit_node_failures + 1))
                  if test "$exit_node_failures" -eq 1 || test "$((exit_node_failures % 150))" -eq 0; then
                    echo "failed to enable exit-node advertisement (exit $exit_status); will retry: $exit_output" >&2
                  fi
                fi
                return 0
              }
              routes_file=/etc/headscale-bootstrap/subnet-routes
              # Read only the CIDR array from the CLI's JSON, without requiring jq.
              actual_routes() {
                awk '
                  { json = json $0 }
                  END {
                    if (!match(json, /"AdvertiseRoutes"[[:space:]]*:[[:space:]]*(null|\[[^]]*\])/)) exit 1
                    value = substr(json, RSTART, RLENGTH)
                    sub(/^[^:]*:[[:space:]]*/, "", value)
                    if (value == "null") exit 0
                    sub(/^\[/, "", value); sub(/\]$/, "", value)
                    gsub(/[[:space:]]/, "", value)
                    if (value == "") exit 0
                    count = split(value, routes, ",")
                    for (i = 1; i <= count; i++) {
                      if (routes[i] !~ /^"[0-9a-fA-F:.]+\/[0-9]+"$/) exit 1
                      gsub(/"/, "", routes[i])
                      if (routes[i] != "0.0.0.0/0" && routes[i] != "::/0") print routes[i]
                    }
                  }
                '
              }
              tailscale_is_running() (
                if status=$(timeout 5 tailscale status --json); then
                  if ! printf '%s\n' "$status" | grep -q '"BackendState"[[:space:]]*:[[:space:]]*"Running"'; then
                    echo "Tailscale is not Running yet" >&2
                    return 1
                  fi
                else
                  status_exit=$?
                  echo "cannot query Tailscale state (exit $status_exit)" >&2
                  return 1
                fi
              )
              authkey_failures=0
              cleanup_authkey() {
                if ! test -e /var/run/tailscale-auth/authkey; then
                  authkey_failures=0
                  return 0
                fi
                # Only query status while a key remains. Keep credentials until
                # login completes, including after a tailscale-only restart.
                if ! tailscale_is_running 2>/dev/null; then
                  return 0
                fi
                if rm -f /var/run/tailscale-auth/authkey 2>/dev/null; then
                  authkey_failures=0
                else
                  authkey_failures=$((authkey_failures + 1))
                  if test "$authkey_failures" -eq 1 || test "$((authkey_failures % 150))" -eq 0; then
                    echo "cannot remove temporary Tailscale authkey; will retry" >&2
                  fi
                fi
                return 0
              }
              dns_failures=0
              sync_dns() (
                core_tmp=""
                ip_tmp=""
                trap 'rm -f "${core_tmp}" "${ip_tmp}"' EXIT
                tailscale_is_running || return 1
                dns_ip=$(timeout 5 tailscale ip -4) || {
                  echo "cannot query Tailscale IPv4 address" >&2
                  return 1
                }
                printf '%s\n' "$dns_ip" | awk -F. '
                  NF != 4 { exit 1 }
                  { for (i=1;i<=4;i++) if ($i !~ /^[0-9]+$/ || $i > 255) exit 1 }
                  END { if (NR != 1) exit 1 }
                ' || {
                  echo "Tailscale IPv4 address is empty or invalid" >&2
                  return 1
                }
                # A sentinel preserves trailing newlines in shell substitutions.
                # Compare actual disk contents, not the previous loop's result.
                expected=$(sed "s/__TAILSCALE_DNS_IP__/${dns_ip}/g" /etc/coredns-template/Corefile && printf '.') || return 1
                current=""
                if test -e /etc/coredns-runtime/Corefile || test -L /etc/coredns-runtime/Corefile; then
                  current=$(cat /etc/coredns-runtime/Corefile && printf '.') || return 1
                fi
                if test "$current" != "$expected"; then
                  core_tmp=$(mktemp /etc/coredns-runtime/Corefile.XXXXXX) || return 1
                  printf '%s' "${expected%.}" > "$core_tmp" || return 1
                  chmod 0644 "$core_tmp" && mv -f "$core_tmp" /etc/coredns-runtime/Corefile || return 1
                fi
                # Corefile existence releases startupProbe so dns-proxy can
                # start independently. Do not publish an address until that
                # resolver actually serves the expected A record. Bound each
                # attempt so a DNS failure cannot stall subnet reconciliation.
                dns_query=dns-sync.olares.internal
                if ! dns_answer=$(timeout 2 nslookup -type=A "${dns_query}." "$dns_ip" 2>&1); then
                  echo "DNS resolver $dns_ip is not ready" >&2
                  return 1
                fi
                # BusyBox prints the resolver address before the answer.
                # Only accept Address lines under the matching Name section;
                # the Server/Address header alone must never pass this check.
                if ! printf '%s\n' "$dns_answer" | awk -v query="$dns_query" -v expected="$dns_ip" '
                  /^Name:[[:space:]]*/ {
                    name = $2
                    sub(/\.$/, "", name)
                    in_answer = (name == query)
                    next
                  }
                  in_answer && /^Address([[:space:]]+[0-9]+)?:[[:space:]]*/ {
                    address = $0
                    sub(/^Address([[:space:]]+[0-9]+)?:[[:space:]]*/, "", address)
                    sub(/[[:space:]]+$/, "", address)
                    if (address == expected) found = 1
                    else invalid = 1
                  }
                  END { exit !(found && !invalid) }
                '; then
                  echo "DNS resolver $dns_ip did not return the expected A record" >&2
                  return 1
                fi
                expected=$(printf '%s\n.' "$dns_ip")
                current=""
                if test -e /etc/headscale-bootstrap/tailscale.ip || test -L /etc/headscale-bootstrap/tailscale.ip; then
                  current=$(cat /etc/headscale-bootstrap/tailscale.ip && printf '.') || return 1
                fi
                if test "$current" != "$expected"; then
                  ip_tmp=$(mktemp /etc/headscale-bootstrap/tailscale.ip.XXXXXX) || return 1
                  printf '%s' "${expected%.}" > "$ip_tmp" || return 1
                  chmod 0644 "$ip_tmp" && mv -f "$ip_tmp" /etc/headscale-bootstrap/tailscale.ip || return 1
                  echo "published shared Tailscale DNS address: $dns_ip"
                fi
              )
              sync_routes() {
                configured=""
                if test -e "${routes_file}"; then
                  if ! configured="$(cat "${routes_file}" 2>&1)"; then
                    read_failures=$((read_failures + 1))
                    if test "${read_failures}" -eq 1 || test "$((read_failures % 150))" -eq 0; then
                      echo "cannot read ${routes_file}; keeping current routes: ${configured}" >&2
                    fi
                    return 0
                  fi
                fi
                read_failures=0
                configured="$(printf '%s' "${configured}" | tr -d '[:space:]')"
                # Compatibility marker for existing LarePass clients.
                desired="10.255.255.254/32"
                if test -n "${configured}"; then
                  desired="${desired},${configured}"
                fi
                if prefs="$(timeout 5 tailscale debug prefs 2>/dev/null)" &&
                  actual="$(printf '%s\n' "${prefs}" | actual_routes)"; then
                  prefs_failures=0
                else
                  prefs_failures=$((prefs_failures + 1))
                  if test "${prefs_failures}" -eq 1 || test "$((prefs_failures % 150))" -eq 0; then
                    echo "cannot read Tailscale advertised routes; keeping current routes and retrying in 2s" >&2
                  fi
                  return 0
                fi
                expected="$(printf '%s\n' "${desired}" | tr ',' '\n' | LC_ALL=C sort -u)"
                actual="$(printf '%s\n' "${actual}" | LC_ALL=C sort -u)"
                if test "${actual}" = "${expected}"; then
                  failures=0
                  return 0
                fi
                if set_output="$(timeout 5 tailscale set \
                  --advertise-routes="${desired}" 2>&1)"; then
                  failures=0
                else
                  set_status=$?
                  failures=$((failures + 1))
                  if test "${failures}" -eq 1 || test "$((failures % 150))" -eq 0; then
                    echo "failed to publish Olares subnet routes (exit ${set_status}); retrying in 2s: ${set_output}" >&2
                  fi
                fi
                return 0
              }
              while true; do
                if dns_result=$(sync_dns 2>&1); then
                  if test "$dns_failures" -gt 0; then
                    echo "DNS synchronization recovered"
                  fi
                  dns_failures=0
                  test -z "$dns_result" || echo "$dns_result"
                else
                  dns_failures=$((dns_failures + 1))
                  if test "$dns_failures" -eq 1 || test "$((dns_failures % 150))" -eq 0; then
                    echo "DNS synchronization pending; will retry: $dns_result" >&2
                  fi
                fi
                cleanup_authkey
                sync_exit_node
                sync_routes
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: bootstrap-authkey
              mountPath: /var/run/tailscale-auth
            - name: headscale-bootstrap
              mountPath: /etc/headscale-bootstrap
            - name: dns-template
              mountPath: /etc/coredns-template
              readOnly: true
            - name: dns-runtime
              mountPath: /etc/coredns-runtime
            - name: tailscale-run
              mountPath: /var/run/tailscale
              readOnly: true
          startupProbe:
            exec:
              command: ["test", "-s", "/etc/coredns-runtime/Corefile"]
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 300
      containers:
        - name: dns-proxy
          image: registry.k8s.io/coredns/coredns:v1.11.3
          imagePullPolicy: IfNotPresent
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: [NET_BIND_SERVICE]
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: dns-runtime
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: bootstrap-authkey
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: bootstrap-token
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  path: bootstrap
                  audience: headscale-bootstrap
                  expirationSeconds: 600
        - name: headscale-bootstrap
          hostPath:
            path: /var/lib/olares/headscale/bootstrap
            type: DirectoryOrCreate
        - name: tailscale-data
          hostPath:
            path: /var/lib/olares/tailscale
            type: DirectoryOrCreate
        - name: tailscale-run
          emptyDir: {}
        - name: tls-cert
          hostPath:
            path: /var/lib/olares/headscale/certs
            type: DirectoryOrCreate
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: dns-template
          configMap:
            name: tailscale-dns
        - name: dns-runtime
          emptyDir: {}
