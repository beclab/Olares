---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: overlaymacallocations.app.bytetrade.io
spec:
  group: app.bytetrade.io
  names:
    kind: OverlayMACAllocation
    listKind: OverlayMACAllocationList
    plural: overlaymacallocations
    singular: overlaymacallocation
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            x-kubernetes-validations:
            - message: MAC allocation address is immutable
              rule: self.mac == oldSelf.mac
            - message: MAC allocation instance identity is immutable
              rule: self.instanceKey == oldSelf.instanceKey
            - message: MAC allocation application UID is immutable
              rule: self.applicationUID == oldSelf.applicationUID
            - message: MAC allocation application reference is immutable
              rule: self.applicationRef == oldSelf.applicationRef
            required:
            - mac
            - instanceKey
            - applicationUID
            - applicationRef
            - phase
            properties:
              mac:
                type: string
                pattern: "^02:[0-9a-f]{2}(:[0-9a-f]{2}){4}$"
              instanceKey:
                type: string
                minLength: 1
              applicationUID:
                type: string
                minLength: 1
              applicationRef:
                type: string
                minLength: 1
              phase:
                type: string
                enum:
                - Pending
                - Bound
                - Releasing
    subresources:
      status: {}
