# Product steady-state SSOT. New install / upgrade default endState=true.
# Emergency rollback: set endState=false and restart consumers (or set pod env false).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: olares-http-mesh-wave
  namespace: os-gateway
  labels:
    app.kubernetes.io/name: http-mesh-wave
    app.kubernetes.io/part-of: uniauth
data:
  endState: "true"
  wave: "4"
  trafficGroupNP: "true"
  l4AppGatewayMTLS: "true"
  entryMTLSPki: "true"
  policyCompilation: "true"
