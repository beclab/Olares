apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: olares-http-mesh-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: Namespaced
  matchConditions:
    - name: enrolled-http-pod
      expression: >-
        (request.namespace.startsWith('user-system-') &&
         ((has(object.spec.serviceAccountName) && object.spec.serviceAccountName == 'bytetrade-sys-ops') ||
          (has(object.metadata.labels) && 'app' in object.metadata.labels && object.metadata.labels['app'] == 'systemserver'))) ||
        (has(object.metadata.annotations) &&
         'traffic.olares.io/mtls-mode' in object.metadata.annotations &&
         object.metadata.annotations['traffic.olares.io/mtls-mode'] == 'Required') ||
        (oldObject != null && has(oldObject.metadata.annotations) &&
         'traffic.olares.io/mtls-mode' in oldObject.metadata.annotations &&
         oldObject.metadata.annotations['traffic.olares.io/mtls-mode'] == 'Required') ||
        (has(object.metadata.labels) && 'traffic.olares.io/bfl-api-mtls' in object.metadata.labels &&
         object.metadata.labels['traffic.olares.io/bfl-api-mtls'] == 'required') ||
        (oldObject != null && has(oldObject.metadata.labels) &&
         'traffic.olares.io/bfl-api-mtls' in oldObject.metadata.labels &&
         oldObject.metadata.labels['traffic.olares.io/bfl-api-mtls'] == 'required') ||
        (request.namespace == 'os-gateway' && has(object.metadata.labels) &&
         'gateway.envoyproxy.io/owning-gateway-name' in object.metadata.labels &&
         object.metadata.labels['gateway.envoyproxy.io/owning-gateway-name'] in ['app-gateway', 'app-access-internal'])
  variables:
    - name: bflAPI
      expression: >-
        has(object.metadata.labels) && 'traffic.olares.io/bfl-api-mtls' in object.metadata.labels &&
        object.metadata.labels['traffic.olares.io/bfl-api-mtls'] == 'required'
    - name: internalGateway
      expression: >-
        request.namespace == 'os-gateway' && has(object.metadata.labels) &&
        'gateway.envoyproxy.io/owning-gateway-name' in object.metadata.labels &&
        object.metadata.labels['gateway.envoyproxy.io/owning-gateway-name'] == 'app-access-internal'
    - name: systemServer
      expression: >-
        request.namespace.startsWith('user-system-') &&
        ((has(object.spec.serviceAccountName) && object.spec.serviceAccountName == 'bytetrade-sys-ops') ||
         (has(object.metadata.labels) && 'app' in object.metadata.labels && object.metadata.labels['app'] == 'systemserver') ||
         (oldObject != null && has(oldObject.metadata.labels) && 'app' in oldObject.metadata.labels && oldObject.metadata.labels['app'] == 'systemserver'))
    - name: nativeProxy
      expression: >-
        has(object.metadata.annotations) &&
        'config.linkerd.io/proxy-enable-native-sidecar' in object.metadata.annotations &&
        object.metadata.annotations['config.linkerd.io/proxy-enable-native-sidecar'] == 'true'
    - name: inboundPolicy
      expression: "variables.internalGateway || variables.bflAPI || variables.systemServer ? 'deny' : 'cluster-authenticated'"
  validations:
    - expression: >-
        !variables.systemServer ||
        (has(object.metadata.labels) && 'app' in object.metadata.labels && object.metadata.labels['app'] == 'systemserver' &&
         has(object.spec.serviceAccountName) && object.spec.serviceAccountName == 'bytetrade-sys-ops' &&
         has(object.metadata.annotations) && 'traffic.olares.io/mtls-mode' in object.metadata.annotations &&
         object.metadata.annotations['traffic.olares.io/mtls-mode'] == 'Required' && variables.nativeProxy &&
         object.spec.containers.exists(c, c.name == 'system-server' && has(c.env) &&
           c.env.exists(e, e.name == 'NONCE_AUTHORIZATION_MODE' && has(e.value) && e.value == 'linkerd' && !has(e.valueFrom))))
      message: System-server nonce requires retained mesh enrollment and the native proxy.
    - expression: >-
        has(object.metadata.annotations) &&
        'linkerd.io/inject' in object.metadata.annotations &&
        object.metadata.annotations['linkerd.io/inject'] == 'enabled' &&
        'config.linkerd.io/default-inbound-policy' in object.metadata.annotations &&
        object.metadata.annotations['config.linkerd.io/default-inbound-policy'] == variables.inboundPolicy &&
        !(oldObject != null && has(oldObject.metadata.annotations) &&
          'traffic.olares.io/mtls-mode' in oldObject.metadata.annotations &&
          oldObject.metadata.annotations['traffic.olares.io/mtls-mode'] == 'Required' &&
          (!('traffic.olares.io/mtls-mode' in object.metadata.annotations) ||
           object.metadata.annotations['traffic.olares.io/mtls-mode'] != 'Required'))
      message: Enrolled HTTP Pods must retain their required Linkerd inbound policy.
    - expression: >-
        (!(oldObject != null && has(oldObject.metadata.labels) &&
           'traffic.olares.io/bfl-api-mtls' in oldObject.metadata.labels &&
           oldObject.metadata.labels['traffic.olares.io/bfl-api-mtls'] == 'required') || variables.bflAPI) &&
        (!variables.bflAPI || (request.namespace.startsWith('user-space-') &&
          'tier' in object.metadata.labels && object.metadata.labels['tier'] == 'bfl'))
      message: Enrolled BFL Pods must retain their tenant API policy selector.
    - expression: >-
        (!has(object.spec.hostNetwork) || !object.spec.hostNetwork) &&
        object.spec.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0)) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))) &&
        ['config.linkerd.io/skip-inbound-ports', 'config.linkerd.io/skip-outbound-ports', 'config.linkerd.io/skip-subnets'].all(
          a, !(a in object.metadata.annotations) || object.metadata.annotations[a] == '')
      message: Enrolled HTTP Pods may not bypass Linkerd interception.
    - expression: >-
        has(object.spec.initContainers) &&
        object.spec.initContainers.exists(c, c.name == 'linkerd-init') &&
        (
          (object.spec.initContainers.size() >= 2 &&
           object.spec.initContainers[0].name == 'linkerd-init' &&
           object.spec.initContainers[1].name == 'linkerd-proxy' &&
           has(object.spec.initContainers[1].restartPolicy) &&
           object.spec.initContainers[1].restartPolicy == 'Always' &&
           has(object.spec.initContainers[1].startupProbe) && has(object.spec.initContainers[1].env) &&
           object.spec.initContainers[1].env.exists(e, e.name == 'LINKERD2_PROXY_INBOUND_DEFAULT_POLICY' &&
             !has(e.valueFrom) && has(e.value) && e.value == variables.inboundPolicy)) ||
          (!variables.nativeProxy && object.spec.containers.exists(c, c.name == 'linkerd-proxy' && has(c.env) &&
            c.env.exists(e, e.name == 'LINKERD2_PROXY_INBOUND_DEFAULT_POLICY' &&
              !has(e.valueFrom) && has(e.value) && e.value == variables.inboundPolicy))))
      message: Enrolled HTTP Pods require an injected Linkerd init container and a configured proxy.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: olares-http-mesh-pods
spec:
  policyName: olares-http-mesh-pods
  validationActions: [Deny, Audit]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: olares-entry-mtls-client-validation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["gateway.envoyproxy.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["clienttrafficpolicies"]
        scope: Namespaced
  matchConditions:
    - name: entry-listener-policy
      expression: >-
        request.namespace == 'os-gateway' &&
        (request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name) in ['app-gateway-l4-entry-mtls', 'app-gateway-l4-authz-mtls']
  validations:
    - expression: "request.operation != 'DELETE'"
      message: Keep client validation installed on the active Entry mTLS listener.
    - expression: >-
        request.operation == 'DELETE' ||
        (has(object.spec.targetRef) && object.spec.targetRef.group == 'gateway.networking.k8s.io' &&
          object.spec.targetRef.kind == 'Gateway' && object.spec.targetRef.name == 'app-gateway' &&
          object.spec.targetRef.sectionName ==
            (object.metadata.name == 'app-gateway-l4-authz-mtls' ? 'l4-authz' : 'l4-mtls') &&
          has(object.spec.tls) && has(object.spec.tls.clientValidation) &&
          object.spec.tls.clientValidation.mode == 'RequireAndVerify' &&
          object.spec.tls.clientValidation.caCertificateRefs.size() == 1 &&
          object.spec.tls.clientValidation.caCertificateRefs.all(
            ca, ca.kind == 'Secret' && ca.group == '' && ca.name == 'olares-l4-agw-mtls' &&
            (!has(ca.namespace) || ca.namespace == 'os-gateway')) &&
          has(object.spec.tls.clientValidation.subjectAltNames) &&
          object.spec.tls.clientValidation.subjectAltNames.dnsNames.size() == 1 &&
          object.spec.tls.clientValidation.subjectAltNames.dnsNames.all(
            san, san.type == 'Exact' && san.value == 'l4-bfl-proxy.entry.client'))
      message: The Entry listener must require the L4 client identity from the Entry trust bundle.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: olares-entry-mtls-client-validation
spec:
  policyName: olares-entry-mtls-client-validation
  validationActions: [Deny, Audit]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: olares-l4-authz-route-writer
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes"]
        scope: Namespaced
  matchConditions:
    - name: auth-listener-or-backend
      expression: >-
        (has(object.spec.parentRefs) && object.spec.parentRefs.exists(p,
          p.name == 'app-gateway' &&
          (!has(p.namespace) ? request.namespace == 'os-gateway' : p.namespace == 'os-gateway') &&
          (has(p.sectionName) ? p.sectionName == 'l4-authz' : (!has(p.port) || p.port == 9444)))) ||
        (has(object.spec.rules) && object.spec.rules.exists(r, has(r.backendRefs) &&
          r.backendRefs.exists(b, b.name == 'authelia-backend' &&
            (has(b.namespace) ? b.namespace : request.namespace).startsWith('user-system-'))))
  validations:
    - expression: >-
        request.userInfo.username == 'system:serviceaccount:os-framework:os-internal' &&
        has(request.userInfo.extra) && 'authentication.kubernetes.io/pod-name' in request.userInfo.extra &&
        request.userInfo.extra['authentication.kubernetes.io/pod-name'].exists(n, n.startsWith('app-service-')) &&
        has(object.spec.parentRefs) && object.spec.parentRefs.size() == 1 &&
        object.spec.parentRefs.all(p, p.name == 'app-gateway' && has(p.namespace) && p.namespace == 'os-gateway' &&
          has(p.sectionName) && p.sectionName == 'l4-authz' && (!has(p.port) || p.port == 9444))
      message: Only app-service pods may attach an Authelia route to the L4 authorization listener.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: olares-l4-authz-route-writer
spec:
  policyName: olares-l4-authz-route-writer
  validationActions: [Deny, Audit]
