# Shared frontend deployment. This chart is packaged in the os-framework release,
# so resource namespaces must not follow .Release.Namespace.
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  namespace: os-frontend
spec:
  selector:
    app: olares-app
  type: ClusterIP
  ports:
    - protocol: TCP
      name: dashboard
      port: 80
      targetPort: 81
---
