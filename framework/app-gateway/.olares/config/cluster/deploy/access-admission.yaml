# Access ValidatingAdmissionWebhook (default failurePolicy=Ignore for safe install).
# End-state (OLARES_UNIAUTH_ENDSTATE=true): fill caBundle then set failurePolicy=Fail.
---
apiVersion: v1
kind: Service
metadata:
  name: access-admission
  namespace: os-app-access
  labels:
    app.kubernetes.io/name: access-admission
spec:
  selector:
    app.kubernetes.io/name: access-admission
  ports:
    - name: webhook
      port: 443
      targetPort: 9443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-admission
  namespace: os-app-access
  labels:
    app.kubernetes.io/name: access-admission
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: access-admission
  template:
    metadata:
      labels:
        app.kubernetes.io/name: access-admission
    spec:
      serviceAccountName: access-admission
      containers:
        - name: admission
          image: beclab/access-admission:v0.1.0
          imagePullPolicy: IfNotPresent
          args: []
          env:
            - name: ACCESS_ADMISSION_ADDR
              value: ":9443"
            # One-shot end-state: set to "true" (drives reconcile + compilation).
            - name: OLARES_UNIAUTH_ENDSTATE
              value: "false"
            - name: OLARES_ACCESS_POLICY_RECONCILE
              value: "false"
            - name: OLARES_POLICY_COMPILATION
              value: "false"
          ports:
            - containerPort: 9443
              name: webhook
          readinessProbe:
            httpGet:
              path: /healthz
              port: webhook
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 10
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-admission
  namespace: os-app-access
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: access-olares-validate
  labels:
    app.kubernetes.io/name: access-admission
webhooks:
  - name: access.olares.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: access-admission
        namespace: os-app-access
        path: /validate
        port: 443
      # caBundle filled by install/certgen before switching failurePolicy to Fail
    failurePolicy: Ignore
    matchPolicy: Equivalent
    sideEffects: None
    timeoutSeconds: 5
    rules:
      - apiGroups: ["access.olares.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["appcapabilitysets", "appaccesspolicies"]
        scope: Namespaced
