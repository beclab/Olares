# Access ValidatingAdmissionWebhook.
# Install/upgrade steady-state: endState from app-access-runtime; process promotes
# failurePolicy to Fail after self-signed caBundle is written.
---
apiVersion: v1
kind: Service
metadata:
  name: access-admission
  namespace: os-app-access
  labels:
    app.kubernetes.io/name: access-admission
spec:
  selector:
    app.kubernetes.io/name: access-admission
  ports:
    - name: webhook
      port: 443
      targetPort: 9443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-admission
  namespace: os-app-access
  labels:
    app.kubernetes.io/name: access-admission
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: access-admission
  template:
    metadata:
      labels:
        app.kubernetes.io/name: access-admission
    spec:
      serviceAccountName: access-admission
      containers:
        - name: admission
          image: beclab/access-admission:v0.1.0
          imagePullPolicy: IfNotPresent
          args: []
          env:
            - name: ACCESS_ADMISSION_ADDR
              value: ":9443"
            - name: OLARES_UNIAUTH_ENDSTATE
              valueFrom:
                configMapKeyRef:
                  name: app-access-runtime
                  key: endState
            - name: OLARES_ACCESS_POLICY_RECONCILE
              valueFrom:
                configMapKeyRef:
                  name: app-access-runtime
                  key: endState
            - name: OLARES_POLICY_COMPILATION
              valueFrom:
                configMapKeyRef:
                  name: app-access-runtime
                  key: policyCompilationEnabled
          ports:
            - containerPort: 9443
              name: webhook
          readinessProbe:
            httpGet:
              path: /healthz
              port: webhook
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 10
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-admission
  namespace: os-app-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: access-admission
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["access.olares.io"]
    resources: ["appaccesspolicies", "appcapabilitysets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy.linkerd.io"]
    resources: ["servers", "authorizationpolicies", "meshtlsauthentications", "httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: access-admission
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: access-admission
subjects:
  - kind: ServiceAccount
    name: access-admission
    namespace: os-app-access
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: access-olares-validate
  labels:
    app.kubernetes.io/name: access-admission
webhooks:
  - name: access.olares.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: access-admission
        namespace: os-app-access
        path: /validate
        port: 443
    # Starts Ignore; access-admission promotes to Fail when endState and caBundle ready.
    failurePolicy: Ignore
    matchPolicy: Equivalent
    sideEffects: None
    timeoutSeconds: 5
    rules:
      - apiGroups: ["access.olares.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["appcapabilitysets", "appaccesspolicies"]
        scope: Namespaced
