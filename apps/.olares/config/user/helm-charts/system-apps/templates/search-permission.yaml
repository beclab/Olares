---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backend:{{ .Values.bfl.username }}:search-provider-svc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.bfl.username }}:search-provider-svc
subjects:
- kind: ServiceAccount
  name: system-frontend
  namespace: {{ .Release.Namespace }}

---
# Shared Settings uses the verified user's token for these read-only endpoints.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.bfl.username }}:settings-search-read
  annotations:
    provider-registry-ref: user-system-{{ .Values.bfl.username }}/search3
    provider-service-ref: search3.os-framework:80
rules:
- nonResourceURLs:
  - "/task/stats/merged"
  - "/monitorsetting/exclude-pattern"
  - "/monitorsetting/include-directory/full_content"
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: user:{{ .Values.bfl.username }}:settings-search-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.bfl.username }}:settings-search-read
subjects:
- kind: User
  apiGroup: rbac.authorization.k8s.io
  name: {{ .Values.bfl.username }}
