apiVersion: v1
kind: ServiceAccount
metadata:
  name: bfl
  namespace: os-frontend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: os-frontend:bfl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: bfl
    namespace: os-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bfl
  namespace: os-frontend
  labels:
    app: bfl
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bfl
  template:
    metadata:
      labels:
        app: bfl
    spec:
      serviceAccountName: bfl
      priorityClassName: system-cluster-critical
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values: [linux]
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      initContainers:
        - name: setsysctl
          image: busybox:1.28
          command:
            - sh
            - -c
            - |
              sysctl -w net.core.somaxconn=65535
              sysctl -w net.ipv4.ip_local_port_range="1024 65535"
              sysctl -w net.ipv4.tcp_tw_reuse=1
              sysctl -w fs.file-max=1048576
          securityContext:
            privileged: true
      containers:
        - name: api
          image: beclab/bfl:v0.4.53-user-domain-1dbafb27f-alpha-2
          imagePullPolicy: IfNotPresent
          command: [/bfl-api, --log-level, debug]
          securityContext:
            runAsUser: 1000
          ports:
            - name: api
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: api
          livenessProbe:
            initialDelaySeconds: 3
            tcpSocket:
              port: api
          env:
            - name: APP_SERVICE_SERVICE_HOST
              value: app-service.os-framework
            - name: APP_SERVICE_SERVICE_PORT
              value: "6755"
            - name: USER_DEFAULT_MEMORY_LIMIT
              value: 3G
            - name: USER_DEFAULT_CPU_LIMIT
              value: 1000m
            - name: BFL_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REVERSE_PROXY_AGENT_IMAGE_NAME
              value: beclab/frpc
            - name: REVERSE_PROXY_AGENT_IMAGE_VERSION
              value: user-domain-027f68075-alpha-1
---
apiVersion: v1
kind: Service
metadata:
  name: bfl
  namespace: os-frontend
spec:
  selector:
    app: bfl
  ports:
    - name: api
      port: 80
      targetPort: api
