apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: app-gateway
  namespace: os-gateway
  labels:
    applications.app.bytetrade.io/author: bytetrade.io
spec:
  gatewayClassName: olares-app-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: app-gateway-envoy-proxy
  tls:
    frontend:
      default: {}
      perPort:
        - port: 9444
          tls:
            validation:
              mode: AllowValidOnly
              caCertificateRefs:
                - group: ""
                  kind: Secret
                  name: olares-l4-agw-mtls
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        # Placeholder cert ref so the Gateway is accepted before app-service syncs
        # the per-viewer entrance TLS Secret onto this listener.
        certificateRefs:
          - kind: Secret
            group: ""
            name: app-gateway-tls
    # L4→AGW Entry mTLS (RequireAndVerify via ClientTrafficPolicy app-gateway-l4-entry-mtls).
    - name: l4-mtls
      protocol: HTTPS
      port: 8443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: olares-l4-agw-mtls
    - name: l4-authz
      protocol: HTTPS
      port: 9444
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: olares-l4-agw-mtls
