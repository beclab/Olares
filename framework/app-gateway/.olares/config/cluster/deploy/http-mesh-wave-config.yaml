# Release projection of fixed HTTP mesh posture (not a kill switch).
# Product steady state is code-enforced: wave 4 + cluster-authenticated.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: olares-http-mesh-wave
  namespace: os-gateway
  labels:
    app.kubernetes.io/name: http-mesh-wave
    app.kubernetes.io/part-of: uniauth
    olares.io/uniauth-posture: "true"
  annotations:
    olares.io/config-integrity: "release-controlled"
data:
  httpMeshPolicy: "cluster-authenticated"
  httpMeshWave: "4"
  trafficGroupNP: "on"
  l4AppGatewayMTLS: "on"
  entryMTLSPki: "on"
  policyCompilation: "on"
