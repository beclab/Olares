apiVersion: apps/v1
kind: Deployment
metadata:
  name: faultgpu
  namespace: {{ .Release.Namespace }}
  annotations:
    applications.app.bytetrade.io/gpu-inject: "false"
spec:
  replicas: {{ .Values.workloads.faultgpu.replicaCount }}
  selector:
    matchLabels:
      app: faultgpu
  template:
    metadata:
      labels:
        app: faultgpu
        # Default policy "all" rewrites the request down to the bound GPU count,
        # so the filter succeeds and the device plugin fails later. "single"
        # keeps the requested count and records InsufficientGPU when fewer
        # GPUs are bound than requested.
        gpu.bytetrade.io/app-pod-consume-policy: single
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      containers:
        - name: faultgpu
          image: docker.io/library/redis:7.4
          args: ["--bind", "0.0.0.0", "--port", "80", "--protected-mode", "no"]
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              nvidia.com/gpu: "64"
              nvidia.com/gpumem: "1048576"
            limits:
              cpu: "1"
              memory: 512Mi
              nvidia.com/gpu: "64"
              nvidia.com/gpumem: "1048576"
---
apiVersion: v1
kind: Service
metadata:
  name: faultgpu-svc
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: faultgpu
  ports:
    - name: http
      port: 80
      targetPort: 80
