apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.bfl.username }}:account-monitor-bfl
  annotations:
    provider-registry-ref: user-system-{{ .Values.bfl.username }}/bfl
    provider-service-ref: bfl.{{ .Release.Namespace }}
    provider-owner-ref: {{ .Values.bfl.username | quote }}
rules:
  - nonResourceURLs: ["/bfl/backend/v1/cluster"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backend:{{ .Values.bfl.username }}:account-monitor-bfl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.bfl.username }}:account-monitor-bfl
subjects:
  - kind: ServiceAccount
    name: system-frontend
    namespace: os-frontend
