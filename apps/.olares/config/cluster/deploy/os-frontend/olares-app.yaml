---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: olares-app-deployment
  namespace: os-frontend
  labels:
    app: olares-app
    applications.app.bytetrade.io/name: olares-app
    applications.app.bytetrade.io/owner: olares
    applications.app.bytetrade.io/author: bytetrade.io
    app.bytetrade.io/api-version: v3
    app.bytetrade.io/app-shared: "true"
  annotations:
    applications.app.bytetrade.io/default-thirdlevel-domains: '[{"appName": "olares-app","entranceName":"dashboard","thirdLevelDomain":"dashboard"},{"appName":"olares-app","entranceName":"control-hub","thirdLevelDomain":"control-hub"},{"appName":"olares-app","entranceName":"files","thirdLevelDomain":"files"},{"appName":"olares-app","entranceName":"share","thirdLevelDomain":"share"},{"appName": "olares-app","entranceName":"vault","thirdLevelDomain":"vault"},{"appName":"olares-app","entranceName":"headscale","thirdLevelDomain":"headscale"},{"appName":"olares-app","entranceName":"settings","thirdLevelDomain":"settings"},{"appName": "olares-app","entranceName":"market","thirdLevelDomain":"market"},{"appName":"olares-app","entranceName":"profile","thirdLevelDomain":"profile"}]'
    applications.app.bytetrade.io/icon: https://app.cdn.olares.com/appstore/olaresapps/icon.png
    applications.app.bytetrade.io/title: 'Olares Apps'
    applications.app.bytetrade.io/version: '0.0.1'
    applications.app.bytetrade.io/entrances: '[{"name":"files", "host":"files-fe-service", "port":80,"title":"Files","windowPushState":true,"icon":"https://app.cdn.olares.com/appstore/files/icon.png"},{"name":"share","authLevel":"public", "host":"share-fe-service", "port":80,"title":"Share","windowPushState":true,"icon":"https://app.cdn.olares.com/appstore/files/icon.png","invisible":true},{"name":"vault", "host":"vault-service", "port":80,"title":"Vault","windowPushState":true,"icon":"https://app.cdn.olares.com/appstore/vault/icon.png"},{"name":"market", "host":"appstore-fe-service", "port":80,"title":"Market","windowPushState":true,"icon":"https://app.cdn.olares.com/appstore/appstore/icon.png"},{"name":"settings", "host":"settings-service", "port":80,"title":"Settings","icon":"https://app.cdn.olares.com/appstore/settings/icon.png"},{"name":"profile", "host":"profile-service", "port":80,"title":"Profile","windowPushState":true,"icon":"https://app.cdn.olares.com/appstore/profile/icon.png"},{"name":"dashboard","host":"dashboard-service","port":80,"title":"Dashboard","windowPushState":true,"icon":"https://app.cdn.olares.com/appstore/dashboard/icon.png"},{"name":"control-hub","host":"control-hub-service","port":80,"title":"Control Hub","windowPushState":true,"icon":"https://app.cdn.olares.com/appstore/control-hub/icon.png"},{"name":"headscale", "host":"headscale-svc", "port":80,"title":"Headscale","invisible": true,"icon":"https://app.cdn.olares.com/appstore/headscale/icon.png"}]'
    applications.app.bytetrade.io/policies: '{"policies":[{"entranceName":"headscale","uriRegex":"/api/refresh","level":"public"}]}'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: olares-app
  template:
    metadata:
      annotations:
        checksum/nginx: {{ include (replace "olares-app.yaml" "olares-app-nginx.yaml" .Template.Name) . | sha256sum }}
      labels:
        app: olares-app
        io.bytetrade.app: "true"
    spec:
      priorityClassName: "system-cluster-critical"
      serviceAccountName: system-frontend
      initContainers:
        - name: olares-app-init
          image: beclab/system-frontend:v1.12.11-alpha.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              test -s /apps/login/index.html
              test -s /apps/login/login-config.json
              cp -r /apps/* /www/
          volumeMounts:
            - mountPath: /www
              name: www-dir

      containers:
        - name: olares-app
          image: beclab/docker-nginx-headers-more:ubuntu-v0.1.0
          imagePullPolicy: IfNotPresent
          readinessProbe:
            httpGet:
              path: /
              port: 91
          ports:
            - containerPort: 81
            - containerPort: 82
            - containerPort: 83
            - containerPort: 85
            - containerPort: 86
            - containerPort: 88
            - containerPort: 89
            - containerPort: 90
            - containerPort: 91
            - containerPort: 92
            - containerPort: 93
            - containerPort: 8090
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              rm -f /etc/nginx/conf.d/default.conf
              # Use the pod's DNS server for legacy routes resolved at request time.
              awk '/^nameserver / { print "resolver " $2 " valid=30s ipv6=off;"; exit }' /etc/resolv.conf > /etc/nginx/resolver.conf
              exec nginx -g 'daemon off;'
          volumeMounts:
            - name: www-dir
              mountPath: /www
            - name: olares-app-nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: olares-app-routes
              mountPath: /etc/nginx/conf.d
        - name: user-service
          image: beclab/user-service:v0.1.23-alpha.1
          imagePullPolicy: IfNotPresent
          readinessProbe:
            tcpSocket:
              port: http
          ports:
            - name: http
              containerPort: 3010
            - name: websocket
              containerPort: 3100
          env:
            - name: DEV_MODE
              value: ''
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: TERMINUSD_HOST
              value: master-node:18088
            - name: APP_SERVICE_SERVICE_HOST
              value: app-service.os-framework
            - name: APP_SERVICE_SERVICE_PORT
              value: '6755'
            - name: APP_SERVICE_CHAIN_ID
              value: '10'
            - name: APP_SERVICE_VERIFYING_CONTRACT
              value: '0xe2eaba0979277a90511f8873ae1e8ca26b54e740'
            - name: APP_SERVICE_CLOUD_URL
              value: 'https://cloud-api.bttcdn.com'
            # value: none / nvidia / nvshare / virtaitech
            - name: GPU
              value: {{ .Values.gpu | default "none" | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: pg_password
                  name: user-service-secrets
            - name: DATABASE_URL
              value: postgres://user_service_os_frontend:$(DATABASE_PASSWORD)@citus-headless.os-platform:5432/os_frontend_user_service?sslmode=disable
            - name: NATS_HOST
              value: nats.os-platform
            - name: NATS_PORT
              value: '4222'
            - name: NATS_USERNAME_USERSERVICE
              value: user-service-os-frontend
            - name: NATS_PASSWORD_USERSESRVICE
              valueFrom:
                secretKeyRef:
                  key: nats_password
                  name: user-service-nats-secret
            # Isolated bootstrap subjects until the image supports per-user delivery.
            - name: NATS_SUBJECT_MARKET
              value: os.market.os-frontend
            - name: NATS_SUBJECT_APPLICATION
              value: os.application.os-frontend
            - name: NATS_SUBJECT_USER_NOTIFICATION
              value: os.notification.os-frontend
            - name: NATS_SUBJECT_DOWNLOAD_STATUS
              value: os.download_status.os-frontend
            - name: NATS_SUBJECT_FILES
              value: os.files.os-frontend
            - name: NATS_SUBJECT_KNOWLEDGE
              value: os.knowledge.os-frontend
            - name: NATS_SUBJECT_VAULT
              value: os.vault.os-frontend
            - name: NATS_SUBJECT_BACKUP
              value: os.backup.os-frontend
            - name: NATS_SUBJECT_INTENT
              value: os.intent.os-frontend
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: redis_password
                  name: user-service-secrets
            - name: REDIS_HOST
              value: redis-cluster-proxy.os-platform
            - name: REDIS_PORT
              value: '6379'
      volumes:
        - name: www-dir
          emptyDir: {}
        - name: olares-app-nginx-config
          configMap:
            name: olares-app-nginx-config
        - name: olares-app-routes
          configMap:
            name: olares-app-routes
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: os-frontend
spec:
  selector:
    app: olares-app
  ports:
    - name: http
      port: 3010
      targetPort: http
    - name: websocket
      port: 3100
      targetPort: websocket
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: system-frontend
  namespace: os-frontend
