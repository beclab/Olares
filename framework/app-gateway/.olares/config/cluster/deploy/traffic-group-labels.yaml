# Namespace traffic-group labels only (soft labeling).
# Controllers may also infer labels via InferTrafficGroup.
#
# IMPORTANT: Do NOT ship default-deny NetworkPolicies in this deploy path.
# Install packaging copies config/cluster/deploy into wizard templates; an
# empty-ingress deny-all on os-gateway would break inbound traffic (AC-5).
# Opt-in NP samples live under archdoc (WI-SYS-UNIAUTH-NP-01).
---
apiVersion: v1
kind: Namespace
metadata:
  name: os-mesh
  labels:
    traffic.olares.io/group: mesh
---
apiVersion: v1
kind: Namespace
metadata:
  name: os-gateway
  labels:
    traffic.olares.io/group: gateway
---
apiVersion: v1
kind: Namespace
metadata:
  name: os-network
  labels:
    traffic.olares.io/group: l4
